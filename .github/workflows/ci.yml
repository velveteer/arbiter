name: CI

env:
  RELEASE_PACKAGES: arbiter-core arbiter-migrations arbiter-worker arbiter-test arbiter-libpq arbiter-simple arbiter-hasql arbiter-orville arbiter-servant arbiter-servant-openapi arbiter-servant-ui arbiter-otel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dashboard:
    name: Dashboard types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbiter-servant-ui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: arbiter-servant-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Generated types match the golden spec
        run: |
          npm run types
          git diff --exit-code types/

      - name: Type check
        run: npm run check

      - name: Format check
        run: npm run format:check

  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.10', '9.12', '9.14']

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: master
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.14'

      - name: Configure
        run: |
          cabal update
          cabal configure --enable-tests

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build
        run: cabal build all

      - name: Test
        env:
          ARBITER_TEST_CONN_STRING: "host=localhost port=5432 user=postgres password=master dbname=postgres"
        run: cabal test all

      - name: Package release libraries
        run: |
          for pkg in $RELEASE_PACKAGES; do
            cabal sdist "$pkg"
          done

      - name: Build release tarballs without workspace overrides
        run: bash .github/check-sdists.sh
