name: Promote Hackage Candidates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0.0)'
        required: true

env:
  RELEASE_PACKAGES: arbiter-core arbiter-migrations arbiter-worker arbiter-worker-testkit arbiter-simple arbiter-hasql arbiter-orville arbiter-servant arbiter-servant-ui arbiter-otel

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14'
          cabal-version: '3.12'

      - name: Promote candidates
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
        run: |
          for pkg in $RELEASE_PACKAGES; do
            cabal sdist $pkg
            version=$(awk '/^version:/ { print $2; exit }' "$pkg/$pkg.cabal")
            tarball="dist-newstyle/sdist/${pkg}-${version}.tar.gz"
            test -f "$tarball" || { echo "No sdist at $tarball"; exit 1; }
            echo "Promoting $tarball..."
            cabal upload --publish --username="$HACKAGE_USERNAME" --password="$HACKAGE_PASSWORD" "$tarball"
          done
