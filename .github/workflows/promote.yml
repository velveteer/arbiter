name: Promote Hackage Candidates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0.0)'
        required: true

env:
  RELEASE_PACKAGES: arbiter-core arbiter-migrations arbiter-worker arbiter-test arbiter-libpq arbiter-simple arbiter-hasql arbiter-orville arbiter-servant arbiter-servant-openapi arbiter-servant-ui arbiter-otel
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Verify candidates exist
        run: |
          set -euo pipefail
          for pkg in $RELEASE_PACKAGES; do
            version=$(awk '/^version:/ { print $2; exit }' "$pkg/$pkg.cabal")
            test "$RELEASE_TAG" = "v$version" || { echo "Tag $RELEASE_TAG does not match $pkg version $version"; exit 1; }
            url="https://hackage.haskell.org/package/${pkg}-${version}/candidate"
            echo "Checking $url"
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
            test "$status" = 200 || { echo "Expected candidate at $url (HTTP $status)"; exit 1; }
          done

      - name: Promote candidates
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
        run: |
          set -euo pipefail
          for pkg in $RELEASE_PACKAGES; do
            version=$(awk '/^version:/ { print $2; exit }' "$pkg/$pkg.cabal")
            echo "Publishing candidate ${pkg}-${version}..."
            curl --fail --silent --show-error --output /dev/null \
              --user "$HACKAGE_USERNAME:$HACKAGE_PASSWORD" \
              --header 'Accept: text/html' --request POST \
              "https://hackage.haskell.org/package/${pkg}-${version}/candidate/publish"
            url="https://hackage.haskell.org/package/${pkg}-${version}"
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")
            test "$status" = 200 || { echo "Published package not found at $url (HTTP $status)"; exit 1; }
          done
