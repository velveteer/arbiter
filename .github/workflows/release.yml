name: Release to Hackage

on:
  push:
    tags: ['v*']

env:
  RELEASE_PACKAGES: arbiter-core arbiter-migrations arbiter-test-common arbiter-worker arbiter-worker-testkit arbiter-simple arbiter-hasql arbiter-orville arbiter-servant arbiter-servant-openapi arbiter-servant-ui arbiter-otel

jobs:
  release:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: master
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14'
          cabal-version: '3.12'

      - name: Configure
        run: |
          cabal update
          cabal configure --enable-tests

      - name: Cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build
        run: cabal build all

      - name: Test
        env:
          ARBITER_TEST_CONN_STRING: "host=localhost port=5432 user=postgres password=master dbname=postgres"
        run: cabal test all

      - name: Check metadata
        run: |
          for pkg in $RELEASE_PACKAGES; do
            echo "Checking $pkg..."
            cd $pkg && cabal check && cd ..
          done

      - name: Package
        run: |
          for pkg in $RELEASE_PACKAGES; do
            cabal sdist $pkg
          done

      - name: Upload candidates to Hackage
        env:
          HACKAGE_USERNAME: ${{ secrets.HACKAGE_USERNAME }}
          HACKAGE_PASSWORD: ${{ secrets.HACKAGE_PASSWORD }}
        run: |
          for pkg in $RELEASE_PACKAGES; do
            version=$(awk '/^version:/ { print $2; exit }' "$pkg/$pkg.cabal")
            tarball="dist-newstyle/sdist/${pkg}-${version}.tar.gz"
            test -f "$tarball" || { echo "No sdist at $tarball"; exit 1; }
            echo "Uploading $tarball..."
            cabal upload --username="$HACKAGE_USERNAME" --password="$HACKAGE_PASSWORD" "$tarball"
          done
