# Public demo stack: ephemeral Postgres + the demo server + Caddy for TLS.
# The image is built and pushed by CI (.github/workflows/demo-image.yml). The
# host only pulls it.
#
#   DEMO_DOMAIN=demo.example.com docker compose -f arbiter-demo/compose.yml up -d
#
# DEMO_DOMAIN defaults to localhost, where Caddy issues a cert from its own CA.
#
# Run from the repository root: the dashboard is mounted from
# arbiter-otel/deploy/observability. The dashboard is served at /dash.
#
# Postgres is intentionally stateless (no volume): the demo drops and reseeds
# its schema on every boot, so a fresh start is the desired behavior.
name: arbiter-demo

services:
  db:
    image: postgres:17.4
    environment:
      POSTGRES_PASSWORD: master
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  demo:
    image: ghcr.io/velveteer/arbiter-demo:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "host=db port=5432 user=postgres password=master dbname=postgres"
      SCHEMA: arbiter_demo
      PORT: "8080"
      # Self-restart cadence: the watchdog raises SIGTERM after this many
      # minutes, the process exits, and restart:always reseeds a clean demo.
      RESET_INTERVAL_MINUTES: "20"
      # Bursty batch inserts into bulk_queue, drained by BURST_WORKERS threads
      # claiming BURST_BATCH jobs at a time. Raise the size or shorten the
      # interval to push harder on vacuum pressure.
      BURST_INTERVAL_SECONDS: "10"
      BURST_SIZE: "1000"
      BURST_WORKERS: "6"
      BURST_BATCH: "25"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4318"
      OTEL_SERVICE_NAME: arbiter-demo
      # The dashboard's rate panels use a 1m window, which needs samples well
      # inside it. The SDK default of 60s leaves them empty.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    restart: always

  # Grafana's all-in-one LGTM stack, taking OTLP from the demo. Only its Grafana
  # is reachable outside, through caddy.
  lgtm:
    image: grafana/otel-lgtm:latest
    environment:
      # Caddy serves it under a subpath.
      GF_SERVER_ROOT_URL: "https://${DEMO_DOMAIN:-localhost}/dash"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Land on the arbiter dashboard rather than Grafana's home.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/arbiter/arbiter.json
      # Public: read-only, no login form. The local stack grants Admin instead.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../arbiter-otel/deploy/observability/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter:ro
      - ../arbiter-otel/deploy/observability/grafana/provisioning/dashboards/provider.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter.yaml:ro
      - ../arbiter-otel/deploy/observability/grafana/provisioning/alerting/arbiter.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/arbiter.yaml:ro
    restart: always

  caddy:
    image: caddy:2
    depends_on:
      - demo
      - lgtm
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  # Polls the registry and auto-pulls + restarts the demo when its image tag
  # changes, so a CI push of :latest redeploys within the interval. --label-enable
  # limits it to the labelled demo service, leaving db/caddy/itself untouched.
  watchtower:
    image: nickfedor/watchtower
    command: --interval 300 --cleanup --label-enable
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  caddy_data:
  caddy_config:
