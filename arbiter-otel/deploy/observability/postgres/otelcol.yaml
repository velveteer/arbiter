# Added to the LGTM image's collector config: scrape postgres_exporter and send
# the samples down the same path as the OTLP metrics.
receivers:
  prometheus/postgres:
    config:
      scrape_configs:
        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]

service:
  pipelines:
    metrics/postgres:
      receivers: [prometheus/postgres]
      processors: [batch]
      exporters: [otlp_http/metrics]
