# Grafana's all-in-one LGTM stack, for viewing what an arbiter process exports.
#
#   docker compose -f arbiter-otel/deploy/observability/compose.yaml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
#   OTEL_SERVICE_NAME=arbiter-demo \
#   cabal run arbiter-demo
#
# Grafana is then at http://localhost:3000 with the arbiter dashboard provisioned.
services:
  lgtm:
    image: grafana/otel-lgtm:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter:ro
      - ./grafana/provisioning/dashboards/provider.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter.yaml:ro
    ports:
      - "3000:3000"     # Grafana
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
