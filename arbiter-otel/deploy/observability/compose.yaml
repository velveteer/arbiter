# Grafana's all-in-one LGTM stack, for viewing what an arbiter process exports.
#
#   docker compose -f arbiter-otel/deploy/observability/compose.yaml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
#   OTEL_SERVICE_NAME=arbiter-demo \
#   DATABASE_URL="host=localhost port=54324 user=postgres password=master dbname=postgres" \
#   cabal run arbiter-demo
#
# The arbiter dashboard is then at http://localhost:3000/dash. postgres_exporter
# reads the database from the repository's compose.yml by default. Point
# PG_EXPORTER_DSN at another one.

services:
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    # Adds the postgres_exporter scrape to the bundled collector.
    command: ["--otelcol-config=file:/otel-lgtm/postgres-scrape.yaml"]
    environment:
      # Served under /dash, on the arbiter dashboard, as the deployment does.
      - GF_SERVER_ROOT_URL=http://localhost:3000/dash
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter/arbiter.json
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter:ro
      - ./grafana/provisioning/dashboards/provider.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/arbiter.yaml:ro
      - ./grafana/provisioning/alerting/arbiter.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/arbiter.yaml:ro
      - ./postgres/otelcol.yaml:/otel-lgtm/postgres-scrape.yaml:ro
    ports:
      - "3000:3000"     # Grafana
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  # Database-wide Postgres statistics for the Postgres dashboard.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: ${PG_EXPORTER_DSN:-postgresql://postgres:master@host.docker.internal:54324/postgres?sslmode=disable}
      PG_EXPORTER_EXTEND_QUERY_PATH: /queries.yaml
    volumes:
      - ./postgres/queries.yaml:/queries.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
