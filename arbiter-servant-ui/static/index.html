<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbiter Admin</title>
  <meta name="theme-color" content="#0f1320">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">
  <script>
    document.documentElement.setAttribute('data-bs-theme',
      localStorage.getItem('arbiter-theme') || 'dark');
  </script>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/fonts/electrolize.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body x-cloak x-data>

<!-- Global top-bar loader for initial view loads -->
<div class="top-loader" x-show="$store.app.showLoader" x-cloak role="status" aria-label="Loading"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#" aria-label="Arbiter" title="Arbiter">
      <img class="brand-mark" src="arbiter-mark.svg" alt="" width="38" height="38">
    </a>

    <!-- Primary nav: the queue area plus the instance-wide singletons -->
    <nav class="nav-primary" aria-label="Primary"
      x-effect="$store.app.view; $nextTick(() => $el.querySelector('.nav-primary-link.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' }))">
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'queues' }"
        @click="$store.app.setView('queues')">Queues</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'ratelimits' }"
        @click="$store.app.setView('ratelimits')">Rate Limits</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'concurrency' }"
        @click="$store.app.setView('concurrency')">Concurrency</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'cron' }"
        @click="$store.app.setView('cron')">Cron</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'workers' }"
        @click="$store.app.setView('workers')">Workers</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'events' }"
        @click="$store.app.setView('events')">Events</button>
    </nav>

    <!-- Controls: SSE status, theme -->
    <div class="nav-controls d-flex align-items-center gap-3 ms-auto">
      <!-- Server health. The events stream reports itself on the Events tab. -->
      <span class="status-pip" role="status" :class="$store.app.healthState"
        :title="$store.app.healthTitle" :aria-label="$store.app.healthTitle">
        <span class="status-dot" aria-hidden="true"></span>
      </span>

      <!-- Theme toggle -->
      <button class="btn btn-sm nav-theme-toggle" @click="$store.app.toggleTheme()"
        :title="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        :aria-label="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        <span x-show="$store.app.theme === 'dark'">&#9788;</span>
        <span x-show="$store.app.theme !== 'dark'">&#9789;</span>
      </button>
    </div>
  </div>
</nav>

<!-- Main content -->
<main class="container-fluid mt-3" x-effect="document.title = $store.app.pageTitle + ' \u00b7 Arbiter'">
  <h1 class="visually-hidden" x-text="$store.app.pageTitle"></h1>
  <!-- ============================================================ -->
  <!-- Area: Queue list (landing) — shown when no queue is drilled into -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'queues' && !$store.app.selectedQueue && !$store.app._deepLinkPending">
    <div x-data="queueListTab">
      <!-- Instance roll-up: the whole-fleet answer to "is anything wrong". -->
      <div class="queue-summary" :class="{ 'is-loading': !loaded, 'd-none': loaded && rows.length === 0 }">
        <div class="qs-skeleton" x-html="SUMMARY_SKELETON_HTML"></div>
        <div class="qs-item">
          <span class="qs-val" x-text="fmtCount(summary.ready)"></span>
          <span class="qs-lbl">ready</span>
        </div>
        <div class="qs-item">
          <span class="qs-val" x-text="fmtCount(summary.inFlight)"></span>
          <span class="qs-lbl">in-flight</span>
        </div>
        <div class="qs-item">
          <span class="qs-val" :class="{ warn: summary.throttled > 0 }" x-text="fmtCount(summary.throttled)"></span>
          <span class="qs-lbl">throttled</span>
        </div>
        <div class="qs-item">
          <span class="qs-val" :class="{ bad: summary.dlq > 0 }" x-text="fmtCount(summary.dlq)"></span>
          <span class="qs-lbl">in DLQ</span>
        </div>
        <div class="qs-sep" aria-hidden="true"></div>
        <div class="qs-item">
          <span class="qs-val" x-text="summary.workersLive"></span>
          <span class="qs-lbl" x-text="summary.workersLive === 1 ? 'worker' : 'workers'"></span>
        </div>
        <div class="qs-item" x-show="summary.workersPaused > 0">
          <span class="qs-val warn" x-text="summary.workersPaused"></span>
          <span class="qs-lbl">paused</span>
        </div>
        <div class="qs-item" x-show="summary.queuesPaused > 0">
          <span class="qs-val warn" x-text="summary.queuesPaused"></span>
          <span class="qs-lbl" x-text="summary.queuesPaused === 1 ? 'queue paused' : 'queues paused'"></span>
        </div>
      </div>

      <!-- Toolbar: find a queue, and choose how the set is laid out. -->
      <div class="queue-toolbar" :class="{ invisible: !loaded, 'd-none': loaded && rows.length === 0 }">
        <div x-html="TABLE_REFRESH_HTML"></div>
        <div class="queue-search">
          <svg class="queue-search-icon" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="6.8" cy="6.8" r="4.6"/>
            <path d="M10.2 10.2 L14 14" stroke-linecap="round"/>
          </svg>
          <input type="search" class="queue-search-input" x-model="search"
            placeholder="Filter queues" aria-label="Filter queues by name" autocomplete="off" spellcheck="false">
          <button type="button" class="queue-search-clear" x-show="search" @click="search = ''"
            title="Clear filter" aria-label="Clear filter">&#x2715;</button>
        </div>

        <div class="queue-toolbar-end">
          <div class="queue-sort" x-show="viewMode === 'cards'">
            <label class="queue-sort-label" for="queue-sort-select">Sort</label>
            <select id="queue-sort-select" class="queue-sort-select" x-model="sortBy"
              @change="sortDir = defaultSortDir(sortBy)">
              <option value="queue">Name</option>
              <option value="ready">Ready</option>
              <option value="inFlight">In-flight</option>
              <option value="backoff">Backoff</option>
              <option value="throttled">Throttled</option>
              <option value="dlq">DLQ</option>
              <option value="oldest">Oldest ready</option>
              <option value="oldestInFlight">Oldest running</option>
            </select>
            <button type="button" class="queue-sort-dir" @click="sortDir = sortDir === 'asc' ? 'desc' : 'asc'"
              :title="sortDir === 'asc' ? 'Ascending — click for descending' : 'Descending — click for ascending'"
              :aria-label="sortDir === 'asc' ? 'Sorted ascending' : 'Sorted descending'"
              x-text="sortDir === 'asc' ? '\u2191' : '\u2193'"></button>
          </div>

          <div class="view-toggle" role="group" aria-label="Queue layout">
            <button type="button" class="view-toggle-btn" :class="{ active: viewMode !== 'list' }"
              :aria-pressed="viewMode !== 'list'" @click="setViewMode('cards')" title="Card view" aria-label="Card view">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
                <rect x="1" y="1" width="6" height="6" rx="1.2"/>
                <rect x="9" y="1" width="6" height="6" rx="1.2"/>
                <rect x="1" y="9" width="6" height="6" rx="1.2"/>
                <rect x="9" y="9" width="6" height="6" rx="1.2"/>
              </svg>
            </button>
            <button type="button" class="view-toggle-btn" :class="{ active: viewMode === 'list' }"
              :aria-pressed="viewMode === 'list'" @click="setViewMode('list')" title="List view" aria-label="List view">
              <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
                <rect x="1" y="2.2" width="14" height="2.4" rx="1.2"/>
                <rect x="1" y="6.8" width="14" height="2.4" rx="1.2"/>
                <rect x="1" y="11.4" width="14" height="2.4" rx="1.2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Card view -->
      <div class="queue-grid" x-show="loaded && viewMode !== 'list'">
        <template x-for="r in displayRows" :key="r.queue">
          <div class="queue-card" :class="{ 'is-throttled': r.stats?.throttledJobs > 0, 'is-paused': r.paused, 'is-failing': dlqCount(r) > 0 }">
            <a class="queue-card-head" :href="queueUrl(r.queue)" @click="navTo($event, r.queue)">
              <span class="queue-card-name" x-text="r.queue" :title="r.queue"></span>
              <span class="queue-card-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <div class="queue-card-flags">
              <template x-if="pauseState(r)">
                <span class="queue-card-pause" :class="'is-' + pauseState(r).key" x-text="pauseState(r).label"></span>
              </template>
              <template x-if="dlqCount(r) > 0">
                <a class="queue-card-dlq" :href="dlqUrl(r.queue)" @click="navToDLQ($event, r.queue)"
                  :title="'Open the dead-letter queue for ' + r.queue">
                  <span x-text="fmtCount(dlqCount(r))"></span> in DLQ
                </a>
              </template>
            </div>

            <div class="queue-card-body">
              <a class="queue-card-hero" :href="queueUrl(r.queue, 'ready')" @click="navTo($event, r.queue, 'ready')">
                <span class="queue-card-ready" :class="zeroClass(r.stats?.readyJobs)" x-text="fmtCount(r.stats?.readyJobs)"></span>
                <span class="queue-card-ready-label">ready</span>
              </a>
              <div class="queue-card-stats">
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'in_flight')" @click="navTo($event, r.queue, 'in_flight')">
                  <span class="qc-val" :class="zeroClass(r.stats?.inFlightJobs)" x-text="fmtCount(r.stats?.inFlightJobs)"></span><span class="qc-lbl">in-flight</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'scheduled')" @click="navTo($event, r.queue, 'scheduled')">
                  <span class="qc-val" :class="zeroClass(r.stats?.scheduledJobs)" x-text="fmtCount(r.stats?.scheduledJobs)"></span><span class="qc-lbl">scheduled</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'backoff')" @click="navTo($event, r.queue, 'backoff')">
                  <span class="qc-val" :class="zeroClass(r.stats?.backoffJobs)" x-text="fmtCount(r.stats?.backoffJobs)"></span><span class="qc-lbl">backoff</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'throttled')" @click="navTo($event, r.queue, 'throttled')">
                  <span class="qc-val" :class="r.stats?.throttledJobs > 0 ? 'warn' : 'is-zero'" x-text="fmtCount(r.stats?.throttledJobs)"></span><span class="qc-lbl">throttled</span>
                </a>
              </div>
              <div class="queue-card-ages">
                <a class="queue-card-age" :href="queueUrl(r.queue, 'ready')" @click="navTo($event, r.queue, 'ready')"
                  title="Age of the oldest job waiting to be claimed">
                  <span class="qa-lbl">oldest ready</span>
                  <span class="qa-val" :class="zeroClass(r.stats?.oldestReadyAgeSeconds)" x-text="fmtAge(r.stats?.oldestReadyAgeSeconds)"></span>
                </a>
                <a class="queue-card-age" :href="queueUrl(r.queue, 'in_flight')" @click="navTo($event, r.queue, 'in_flight')"
                  title="Time the oldest in-flight job has been running — a handler that never returns keeps climbing">
                  <span class="qa-lbl">oldest running</span>
                  <span class="qa-val" :class="zeroClass(r.stats?.oldestInFlightAgeSeconds)" x-text="fmtAge(r.stats?.oldestInFlightAgeSeconds)"></span>
                </a>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- List view: the same data, rankable by any column. -->
      <div class="table-responsive" x-show="loaded && viewMode === 'list'">
        <table class="table table-striped table-hover table-sm sticky-head queue-table">
          <thead>
            <tr>
              <th class="sortable" @click="toggleSort('queue')" @keydown.enter.prevent="toggleSort('queue')" @keydown.space.prevent="toggleSort('queue')" tabindex="0" :aria-sort="sortBy === 'queue' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Queue<span class="sort-caret" x-text="sortIndicator('queue')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('ready')" @keydown.enter.prevent="toggleSort('ready')" @keydown.space.prevent="toggleSort('ready')" tabindex="0" :aria-sort="sortBy === 'ready' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Ready<span class="sort-caret" x-text="sortIndicator('ready')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('inFlight')" @keydown.enter.prevent="toggleSort('inFlight')" @keydown.space.prevent="toggleSort('inFlight')" tabindex="0" :aria-sort="sortBy === 'inFlight' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">In-flight<span class="sort-caret" x-text="sortIndicator('inFlight')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('scheduled')" @keydown.enter.prevent="toggleSort('scheduled')" @keydown.space.prevent="toggleSort('scheduled')" tabindex="0" :aria-sort="sortBy === 'scheduled' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Scheduled<span class="sort-caret" x-text="sortIndicator('scheduled')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('backoff')" @keydown.enter.prevent="toggleSort('backoff')" @keydown.space.prevent="toggleSort('backoff')" tabindex="0" :aria-sort="sortBy === 'backoff' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Backoff<span class="sort-caret" x-text="sortIndicator('backoff')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('throttled')" @keydown.enter.prevent="toggleSort('throttled')" @keydown.space.prevent="toggleSort('throttled')" tabindex="0" :aria-sort="sortBy === 'throttled' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Throttled<span class="sort-caret" x-text="sortIndicator('throttled')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('dlq')" @keydown.enter.prevent="toggleSort('dlq')" @keydown.space.prevent="toggleSort('dlq')" tabindex="0" :aria-sort="sortBy === 'dlq' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">DLQ<span class="sort-caret" x-text="sortIndicator('dlq')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('oldest')" @keydown.enter.prevent="toggleSort('oldest')" @keydown.space.prevent="toggleSort('oldest')" tabindex="0" :aria-sort="sortBy === 'oldest' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Oldest ready<span class="sort-caret" x-text="sortIndicator('oldest')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('oldestInFlight')" @keydown.enter.prevent="toggleSort('oldestInFlight')" @keydown.space.prevent="toggleSort('oldestInFlight')" tabindex="0" :aria-sort="sortBy === 'oldestInFlight' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Oldest running<span class="sort-caret" x-text="sortIndicator('oldestInFlight')" aria-hidden="true"></span></th>
              <th class="num sortable" @click="toggleSort('workers')" @keydown.enter.prevent="toggleSort('workers')" @keydown.space.prevent="toggleSort('workers')" tabindex="0" :aria-sort="sortBy === 'workers' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Workers<span class="sort-caret" x-text="sortIndicator('workers')" aria-hidden="true"></span></th>
              <th>State</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="r in displayRows" :key="r.queue">
              <tr class="detail-row" @click="rowClick($event, r)">
                <td class="text-truncate">
                  <a class="queue-row-name" :href="queueJobsUrl(r.queue, '')" @click="navToJobs($event, r.queue)" x-text="r.queue" :title="r.queue"></a>
                </td>
                <td class="num"><a class="queue-row-num" :class="zeroClass(r.stats?.readyJobs)" :href="queueUrl(r.queue, 'ready')" @click="navTo($event, r.queue, 'ready')" x-text="fmtCount(r.stats?.readyJobs)"></a></td>
                <td class="num"><a class="queue-row-num" :class="zeroClass(r.stats?.inFlightJobs)" :href="queueUrl(r.queue, 'in_flight')" @click="navTo($event, r.queue, 'in_flight')" x-text="fmtCount(r.stats?.inFlightJobs)"></a></td>
                <td class="num"><a class="queue-row-num" :class="zeroClass(r.stats?.scheduledJobs)" :href="queueUrl(r.queue, 'scheduled')" @click="navTo($event, r.queue, 'scheduled')" x-text="fmtCount(r.stats?.scheduledJobs)"></a></td>
                <td class="num"><a class="queue-row-num" :class="zeroClass(r.stats?.backoffJobs)" :href="queueUrl(r.queue, 'backoff')" @click="navTo($event, r.queue, 'backoff')" x-text="fmtCount(r.stats?.backoffJobs)"></a></td>
                <td class="num"><a class="queue-row-num" :class="r.stats?.throttledJobs > 0 ? 'warn' : 'is-zero'" :href="queueUrl(r.queue, 'throttled')" @click="navTo($event, r.queue, 'throttled')" x-text="fmtCount(r.stats?.throttledJobs)"></a></td>
                <td class="num"><a class="queue-row-num" :class="dlqCount(r) > 0 ? 'bad' : 'is-zero'" :href="dlqUrl(r.queue)" @click="navToDLQ($event, r.queue)" x-text="fmtCount(dlqCount(r))"></a></td>
                <td class="num" :class="zeroClass(r.stats?.oldestReadyAgeSeconds)" x-text="fmtAge(r.stats?.oldestReadyAgeSeconds)"></td>
                <td class="num" :class="zeroClass(r.stats?.oldestInFlightAgeSeconds)" x-text="fmtAge(r.stats?.oldestInFlightAgeSeconds)"></td>
                <td class="num" :class="zeroClass(r.workersLive)" x-text="r.workersLive ?? 0"></td>
                <td>
                  <template x-if="pauseState(r)">
                    <span class="queue-card-pause" :class="'is-' + pauseState(r).key" x-text="pauseState(r).label"></span>
                  </template>
                  <template x-if="!pauseState(r)">
                    <span class="text-muted">&mdash;</span>
                  </template>
                </td>
              </tr>
            </template>
            <tr x-show="displayRows.length === 0 && rows.length > 0">
              <td colspan="11" class="text-muted text-center">No queue matches that filter.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="queue-list-empty" x-show="viewMode !== 'list' && displayRows.length === 0 && rows.length > 0">No queue matches that filter.</div>
      <div class="queue-list-empty" x-show="_loadErrored && rows.length === 0">Failed to load queues. <a href="#" @click.prevent="load()">Retry</a></div>
      <div class="queue-list-empty" x-show="loaded && !_loadErrored && rows.length === 0">No queues available.</div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- Area: Queue detail — the drilled-into queue's scoped sub-tabs -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'queues' && $store.app.selectedQueue && $store.app.detailReady">
    <div x-init="$nextTick(() => activateSubTabFromHash(['stats','jobs','dlq','archive','cron','workers']))">
      <!-- Breadcrumb + quick switcher + pause -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#" @click.prevent="$store.app.setView('queues')">Queues</a></li>
            <li class="breadcrumb-item active" aria-current="page" x-text="$store.app.selectedQueue"></li>
          </ol>
        </nav>
        <div class="dropdown" x-show="$store.app.queues.length > 1">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" title="Switch queue">Switch</button>
          <ul class="dropdown-menu">
            <template x-for="q in $store.app.queues" :key="q">
              <li>
                <a class="dropdown-item" href="#" @click.prevent="$store.app.openQueue(q)" x-text="q"
                  :class="{ 'active': q === $store.app.selectedQueue }"></a>
              </li>
            </template>
          </ul>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3" x-data="queuePauseToggle">
          <span x-show="paused" class="badge paused-badge" :title="pausedAt ? formatTime(pausedAt) : ''">
            queue paused<template x-if="pausedAgeStr"><span class="ms-1 fw-normal" x-text="'(' + pausedAgeStr + ')'"></span></template>
          </span>
          <button class="btn btn-sm text-nowrap" x-show="showPauseToggle" :class="isArmed('toggle') ? 'btn-warning' : (paused ? 'btn-success' : 'btn-outline-warning')"
                  :disabled="busy" @click="onToggle()"
                  x-text="isArmed('toggle') ? 'Click to confirm' : (paused ? 'Resume queue' : 'Pause queue')"></button>

          <!-- Type-to-confirm pause (ARB_CONFIG.pauseConfirm === 'type'). -->
          <div class="modal fade" id="pauseConfirmModal" tabindex="-1" aria-labelledby="pauseConfirmModalLabel">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h2 class="modal-title" id="pauseConfirmModalLabel">Pause queue <code x-text="$store.app.selectedQueue"></code></h2>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p class="text-muted small mb-3">Pausing stops all workers from claiming jobs in this queue until it is resumed. In-flight jobs finish, new ones wait.</p>
                  <label class="form-label small">Type the queue name <code x-text="$store.app.selectedQueue"></code> to confirm:</label>
                  <input type="text" class="form-control form-control-sm" x-model="confirmText" autocomplete="off" spellcheck="false"
                         @keydown.enter.prevent="confirmPause()" :placeholder="$store.app.selectedQueue">
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                  <button type="button" class="btn btn-warning btn-sm" @click="confirmPause()" :disabled="!confirmValid() || busy">Pause queue</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-stats" type="button" role="tab">Stats</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-jobs" type="button" role="tab">Jobs</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-dlq" type="button" role="tab">DLQ</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-archive" type="button" role="tab">Archive</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cron" type="button" role="tab">Cron</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-workers" type="button" role="tab">Workers</button>
        </li>
      </ul>

      <div class="tab-content mt-3">
    <!-- Stats Tab -->
    <div class="tab-pane fade" id="tab-stats" role="tabpanel" x-data="statsTab">
      <div x-show="$store.app.selectedQueue">
        <div class="toolbar">
          <div x-html="TABLE_REFRESH_HTML"></div>
        </div>
        <h2 class="stat-section-label">Jobs by state</h2>
        <div class="row g-3">
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" :href="jobsUrl('')" @click="goToJobs($event, '')">
              <div class="card-body">
                <h3 class="card-title text-muted">Total Jobs</h3>
                <p class="display-6" :class="zeroClass(stats?.totalJobs)" x-text="stats?.totalJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" :href="jobsUrl('ready')" @click="goToJobs($event, 'ready')">
              <div class="card-body">
                <h3 class="card-title text-muted">Ready</h3>
                <p class="display-6" :class="zeroClass(stats?.readyJobs)" x-text="stats?.readyJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Jobs currently leased by a worker" :href="jobsUrl('in_flight')" @click="goToJobs($event, 'in_flight')">
              <div class="card-body">
                <h3 class="card-title text-muted">In-Flight</h3>
                <p class="display-6" :class="zeroClass(stats?.inFlightJobs)" x-text="stats?.inFlightJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Jobs delayed until a future time, not yet attempted" :href="jobsUrl('scheduled')" @click="goToJobs($event, 'scheduled')">
              <div class="card-body">
                <h3 class="card-title text-muted">Scheduled</h3>
                <p class="display-6" :class="zeroClass(stats?.scheduledJobs)" x-text="stats?.scheduledJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Failed jobs waiting out a retry backoff delay" :href="jobsUrl('backoff')" @click="goToJobs($event, 'backoff')">
              <div class="card-body">
                <h3 class="card-title text-muted">Backoff</h3>
                <p class="display-6" :class="zeroClass(stats?.backoffJobs)" x-text="stats?.backoffJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Jobs parked by a rate limit until tokens refill" :href="jobsUrl('throttled')" @click="goToJobs($event, 'throttled')">
              <div class="card-body">
                <h3 class="card-title text-muted">Throttled</h3>
                <p class="display-6" :class="stats?.throttledJobs > 0 ? 'warn' : zeroClass(stats?.throttledJobs)" x-text="stats?.throttledJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Suspended jobs (e.g. rollup finalizers awaiting children)" :href="jobsUrl('suspended')" @click="goToJobs($event, 'suspended')">
              <div class="card-body">
                <h3 class="card-title text-muted">Suspended</h3>
                <p class="display-6" :class="zeroClass(stats?.suspendedJobs)" x-text="stats?.suspendedJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-3">
            <a class="card text-center stat-card" title="Force-cancelled jobs flagged for teardown, not yet reaped" :href="jobsUrl('cancelled')" @click="goToJobs($event, 'cancelled')">
              <div class="card-body">
                <h3 class="card-title text-muted">Cancelled</h3>
                <p class="display-6" :class="zeroClass(stats?.cancelledJobs)" x-text="stats?.cancelledJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
        </div>
        <h2 class="stat-section-label">Health</h2>
        <div class="row g-3">
          <div class="col-sm-6 col-lg-4">
            <a class="card text-center stat-card" :class="{ 'is-danger': stats?.dlqJobs > 0 }" title="Entries in this queue's dead-letter queue" href="#dlq" @click.prevent="goToDLQ()">
              <div class="card-body">
                <h3 class="card-title text-muted">DLQ</h3>
                <p class="display-6" :class="stats?.dlqJobs > 0 ? 'bad' : zeroClass(stats?.dlqJobs)" x-text="stats?.dlqJobs ?? EMPTY"></p>
              </div>
            </a>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card text-center" title="Age of the oldest job currently ready to claim">
              <div class="card-body">
                <h3 class="card-title text-muted">Oldest Ready</h3>
                <p class="display-6" :class="zeroClass(stats?.oldestReadyAgeSeconds)" x-text="fmtAge(stats?.oldestReadyAgeSeconds, EMPTY)"></p>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-lg-4">
            <div class="card text-center" title="How long the oldest in-flight job has been running — a handler that never returns keeps climbing">
              <div class="card-body">
                <h3 class="card-title text-muted">Oldest Running</h3>
                <p class="display-6" :class="zeroClass(stats?.oldestInFlightAgeSeconds)" x-text="fmtAge(stats?.oldestInFlightAgeSeconds, EMPTY)"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div x-show="$store.app.initialized && !$store.app.selectedQueue" class="text-muted mt-3">No queues available.</div>
    </div>

    <!-- Jobs Tab -->
    <div class="tab-pane fade" id="tab-jobs" role="tabpanel" x-data="jobsTab">
      <!-- Toolbar -->
      <div class="toolbar">
        <div x-html="TABLE_REFRESH_HTML"></div>
        <!-- Filters -->
        <div class="filter-builder" x-html="FILTER_BUILDER_HTML"></div>
        <select class="form-select form-select-sm" style="width: auto;" title="Filter by job state" aria-label="Filter by job state"
          x-model="stateFilter" @change="applyState()">
          <option value="">All states</option>
          <option value="ready">Ready</option>
          <option value="in_flight">In-flight</option>
          <option value="backoff">Backoff</option>
          <option value="scheduled">Scheduled</option>
          <option value="throttled">Throttled</option>
          <option value="suspended">Suspended</option>
          <option value="cancelled">Cancelled</option>
        </select>

        <!-- View -->
        <button class="btn btn-sm" :class="effectiveViewMode === 'tree' ? 'btn-primary' : 'btn-outline-primary'"
          @click="toggleViewMode()" :aria-pressed="effectiveViewMode === 'tree'"
          :disabled="!!stateFilter"
          :title="stateFilter ? 'A status filter always renders flat' : effectiveViewMode === 'tree' ? 'Tree view: children hidden until expanded' : 'Flat view: all jobs shown'">
          <span x-text="effectiveViewMode === 'tree' ? 'Tree' : 'Flat'"></span>
        </button>

        <!-- Columns -->
        <div x-html="COLUMNS_MENU_HTML"></div>

        <!-- Actions -->
        <button class="btn btn-outline-success btn-sm" @click="showInsertForm = !showInsertForm; insertError = ''">+ Insert</button>
      </div>
      <div class="text-info small mb-2" x-show="refreshMode === 'paused' && pendingChanges > 0" x-text="pendingChanges + ' changes pending'"></div>

      <!-- Insert Form -->
      <div class="card mb-3" x-show="showInsertForm">
        <div class="card-body">
          <h2 class="card-title">Insert New Job</h2>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Payload (JSON)</label>
              <textarea class="form-control font-monospace" rows="3" x-model="insertPayload" :class="{ 'is-invalid': insertPayloadInvalid }"></textarea>
              <small class="text-danger" x-show="insertPayloadInvalid">Invalid JSON</small>
            </div>
            <div class="col-md-2">
              <label class="form-label">Group Key</label>
              <input type="text" class="form-control" x-model="insertGroupKey" placeholder="Optional">
            </div>
            <div class="col-md-2">
              <label class="form-label">Dedup Key</label>
              <input type="text" class="form-control" x-model="insertDedupKey" placeholder="Optional">
            </div>
            <div class="col-md-1" x-show="insertDedupKey">
              <label class="form-label">Strategy</label>
              <select class="form-select" x-model="insertDedupStrategy">
                <option value="ignore">Ignore</option>
                <option value="replace">Replace</option>
              </select>
            </div>
            <div class="col-md-1">
              <label class="form-label">Priority</label>
              <input type="number" class="form-control" x-model="insertPriority">
            </div>
            <div class="col-md-3">
              <label class="form-label">Scheduled For</label>
              <input type="datetime-local" class="form-control" x-model="insertNotVisibleUntil" title="Optional: the job stays scheduled and is not claimable until this local time">
            </div>
            <div class="col-md-2">
              <label class="form-label">Max Attempts</label>
              <input type="number" min="1" class="form-control" x-model="insertMaxAttempts" placeholder="Default">
            </div>
          </div>
          <div class="mt-2 d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" @click="submitInsert()" :disabled="inserting">
              <span x-text="inserting ? 'Inserting…' : 'Insert'"></span>
            </button>
            <small class="alert alert-danger mb-0 inline-error" x-show="insertError" x-text="insertError"></small>
          </div>
        </div>
      </div>

      <!-- Bulk actions (shown when rows are selected) -->
      <div class="align-items-center gap-2 mb-2" :class="selectedCount > 0 ? 'd-flex' : 'd-none'">
        <span class="small fw-semibold" x-text="selectedCount + ' selected'"></span>
        <button class="btn btn-sm" :class="isArmed('bulkPromote') ? 'btn-primary' : 'btn-outline-primary'" :disabled="bulkBusy" @click="bulkPromote()" x-text="isArmed('bulkPromote') ? ('Confirm promote ' + selectedCount) : 'Promote selected'"></button>
        <button class="btn btn-sm" :class="isArmed('bulkCancel') ? 'btn-warning' : 'btn-outline-warning'" :disabled="bulkBusy" @click="bulkCancel()" x-text="isArmed('bulkCancel') ? ('Confirm cancel ' + selectedCount + ' (with descendants)') : 'Cancel selected'"></button>
        <button class="btn btn-sm" :class="isArmed('bulkDlq') ? 'btn-danger' : 'btn-outline-danger'" :disabled="bulkBusy" @click="bulkMoveToDLQ()" x-text="isArmed('bulkDlq') ? ('Confirm move ' + selectedCount + ' to DLQ') : 'Move selected to DLQ'"></button>
        <button class="btn btn-link btn-sm text-muted text-decoration-none p-0 ms-1" @click="selected = {}">Clear</button>
      </div>

      <!-- Pagination (top) -->
      <div x-html="PAGINATION_TOP_HTML"></div>

      <!-- Jobs table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover table-sm sticky-head" style="table-layout: fixed; width: 100%;">
          <thead>
            <tr>
              <th class="select-cell" :style="'width:' + colPct('select') + '%'"><input class="form-check-input m-0" type="checkbox" title="Select all on this page" aria-label="Select all on this page"
                  :checked="allSelected" @change="toggleSelectAll()"></th>
              <th class="sortable" :style="'width:' + colPct('id') + '%'" @click="toggleSort('id')" @keydown.enter.prevent="toggleSort('id')" @keydown.space.prevent="toggleSort('id')" tabindex="0" :aria-sort="sortBy === 'id' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">ID<span class="sort-caret" x-text="sortIndicator('id')" aria-hidden="true"></span></th>
              <th :class="{ 'd-none': !colVisible('payload') }" :style="'width:' + colPct('payload') + '%'">Payload</th>
              <th class="sortable" :class="{ 'd-none': !colVisible('group') }" :style="'width:' + colPct('group') + '%'" @click="toggleSort('group_key')" @keydown.enter.prevent="toggleSort('group_key')" @keydown.space.prevent="toggleSort('group_key')" tabindex="0" :aria-sort="sortBy === 'group_key' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Group<span class="sort-caret" x-text="sortIndicator('group_key')" aria-hidden="true"></span></th>
              <th class="sortable" :class="{ 'd-none': !colVisible('parent') }" :style="'width:' + colPct('parent') + '%'" @click="toggleSort('parent_id')" @keydown.enter.prevent="toggleSort('parent_id')" @keydown.space.prevent="toggleSort('parent_id')" tabindex="0" :aria-sort="sortBy === 'parent_id' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Parent<span class="sort-caret" x-text="sortIndicator('parent_id')" aria-hidden="true"></span></th>
              <th :class="{ 'd-none': !colVisible('children') }" :style="'width:' + colPct('children') + '%'">Children</th>
              <th class="sortable" :class="{ 'd-none': !colVisible('priority') }" :style="'width:' + colPct('priority') + '%'" @click="toggleSort('priority')" @keydown.enter.prevent="toggleSort('priority')" @keydown.space.prevent="toggleSort('priority')" tabindex="0" :aria-sort="sortBy === 'priority' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Priority<span class="sort-caret" x-text="sortIndicator('priority')" aria-hidden="true"></span></th>
              <th class="sortable" :class="{ 'd-none': !colVisible('attempts') }" :style="'width:' + colPct('attempts') + '%'" @click="toggleSort('attempts')" @keydown.enter.prevent="toggleSort('attempts')" @keydown.space.prevent="toggleSort('attempts')" tabindex="0" :aria-sort="sortBy === 'attempts' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Attempts<span class="sort-caret" x-text="sortIndicator('attempts')" aria-hidden="true"></span></th>
              <th :class="{ 'd-none': !colVisible('status') }" :style="'width:' + colPct('status') + '%'">Status</th>
              <th class="sortable" :class="{ 'd-none': !colVisible('inserted') }" :style="'width:' + colPct('inserted') + '%'" @click="toggleSort('inserted_at')" @keydown.enter.prevent="toggleSort('inserted_at')" @keydown.space.prevent="toggleSort('inserted_at')" tabindex="0" :aria-sort="sortBy === 'inserted_at' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Inserted<span class="sort-caret" x-text="sortIndicator('inserted_at')" aria-hidden="true"></span></th>
              <th class="sortable" :class="{ 'd-none': !colVisible('visible') }" :style="'width:' + colPct('visible') + '%'" @click="toggleSort('not_visible_until')" @keydown.enter.prevent="toggleSort('not_visible_until')" @keydown.space.prevent="toggleSort('not_visible_until')" tabindex="0" :aria-sort="sortBy === 'not_visible_until' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">
                <span x-text="notVisibleFormat === 'countdown' ? 'Visible In' : 'Visible At'"></span><span class="sort-caret" x-text="sortIndicator('not_visible_until')" aria-hidden="true"></span>
              </th>
              <th :class="{ 'd-none': !colVisible('gates') }" :style="'width:' + colPct('gates') + '%'">Gates</th>
              <th class="cell-actions" :class="{ 'd-none': !colVisible('actions') }" :style="'width:' + colPct('actions') + '%'">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="job in displayJobs" :key="String(job.primaryKey) + '-' + job._depth">
              <tr :class="[job._depth > 0 ? 'child-row' : '', job._isMoreRow ? '' : 'detail-row', isSelected(job.primaryKey) ? 'table-active' : '']"
                @click="rowClick($event, job)">
                <template x-if="job._isMoreRow">
                  <td :colspan="columns.length" class="text-center text-muted small fst-italic"
                    :style="'background: linear-gradient(to right, color-mix(in srgb, var(--arb-teal-dim) 35%, transparent) ' + (job._depth * 12) + 'px, transparent ' + (job._depth * 12 + 6) + 'px)'">
                    Showing <span x-text="job._shown"></span> of <span x-text="job._total"></span> children of #<span x-text="job._parentKey"></span> &mdash;
                    <a href="#" @click.prevent="filterByParent(job._parentKey)">view all</a>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="select-cell"><input class="form-check-input m-0" type="checkbox" aria-label="Select job"
                      :checked="isSelected(job.primaryKey)" @change="toggleSelect(job.primaryKey)"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate"
                    :style="job._depth ? 'background: linear-gradient(to right, color-mix(in srgb, var(--arb-teal-dim) 35%, transparent) ' + (job._depth * 12) + 'px, transparent ' + (job._depth * 12 + 6) + 'px)' : ''"
                    x-text="job.primaryKey"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate" x-show="colVisible('payload')" :title="JSON.stringify(job.payload)"
                    x-text="truncate(job.payload)"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate" x-show="colVisible('group')" x-text="job.groupKey || EMPTY"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('parent')">
                    <template x-if="job.parentId">
                      <a href="#" class="text-decoration-none"
                        @click.prevent="filterByParent(job.parentId)"
                        x-text="job.parentId"></a>
                    </template>
                    <template x-if="!job.parentId">
                      <span>&mdash;</span>
                    </template>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                <td x-show="colVisible('children')">
                  <template x-if="job._childCount || job._dlqChildCount">
                    <span class="d-inline-flex gap-1 flex-wrap align-items-center">
                      <template x-if="job._childCount">
                        <span class="d-inline-flex align-items-center gap-1">
                          <!-- Tree view: expand to nest children. Flat view already lists them as rows. -->
                          <template x-if="effectiveViewMode === 'tree'">
                            <a href="#" class="text-decoration-none d-inline-flex align-items-center gap-1"
                              @click.prevent="toggleChildren(job.primaryKey)">
                              <span class="expand-arrow" x-text="isExpanded(job.primaryKey) ? '▼' : '▶'"></span>
                              <span class="badge bg-info-subtle text-info-emphasis"
                                x-text="job._childCount + (job._childCount === 1 ? ' child' : ' children')"></span>
                            </a>
                          </template>
                          <template x-if="effectiveViewMode !== 'tree'">
                            <span class="text-muted small"
                              x-text="job._childCount + (job._childCount === 1 ? ' child' : ' children')"></span>
                          </template>
                        </span>
                      </template>
                      <template x-if="job._dlqChildCount">
                        <span class="badge bg-danger-subtle text-danger-emphasis"
                          x-text="job._dlqChildCount + ' in DLQ'"></span>
                      </template>
                    </span>
                  </template>
                  <template x-if="!job._childCount && !job._dlqChildCount">
                    <span>&mdash;</span>
                  </template>
                </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('priority')" x-text="job.priority"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('attempts')" x-text="job.attempts"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('status')">
                    <span class="badge" :class="statusBadgeClass(job.status)" x-text="job.status"></span>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate" x-show="colVisible('inserted')" :title="formatTime(job.insertedAt, EMPTY)" x-text="formatAge(job.insertedAt, EMPTY)"></td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate font-monospace" x-show="colVisible('visible')">
                    <span class="format-toggle-cell" :class="{ 'has-no-value': !job.notVisibleUntil }" tabindex="0" role="button"
                          @click="toggleNotVisibleFormat()"
                          @keydown.enter.prevent="toggleNotVisibleFormat()"
                          @keydown.space.prevent="toggleNotVisibleFormat()"
                          :title="job.notVisibleUntil ? 'Click to switch format · ' + (notVisibleFormat === 'countdown' ? formatTime(job.notVisibleUntil) : formatCountdown(job.notVisibleUntil)) : 'Click to switch format'"
                          x-text="formatNotVisible(job.notVisibleUntil)"></span>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('gates')">
                    <span class="gate-badges" x-show="job.rateLimit || job.concurrency">
                      <a class="gate-badge is-rate" :class="{ 'is-empty': !job.rateLimit }" href="#"
                        :title="job.rateLimit ? gateTitle(job.rateLimit, 'Rate limit') + ' \u2014 open policy' : ''"
                        @click.prevent="job.rateLimit && $store.app.openPolicy('ratelimits', job.rateLimit.prefix)"
                        x-text="job.rateLimit ? job.rateLimit.prefix : ''"></a>
                      <a class="gate-badge is-conc" :class="{ 'is-empty': !job.concurrency }" href="#"
                        :title="job.concurrency ? gateTitle(job.concurrency, 'Concurrency') + ' \u2014 open policy' : ''"
                        @click.prevent="job.concurrency && $store.app.openPolicy('concurrency', job.concurrency.prefix)"
                        x-text="job.concurrency ? job.concurrency.prefix : ''"></a>
                    </span>
                    <span x-show="!job.rateLimit && !job.concurrency">&mdash;</span>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="cell-actions" x-show="colVisible('actions')">
                    <div class="dropdown">
                      <button class="btn btn-row-actions btn-sm" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" :disabled="isBusy(job.primaryKey)" title="Row actions" aria-label="Row actions">&#8942;</button>
<ul class="dropdown-menu dropdown-menu-end" x-html="JOB_ACTIONS_HTML"></ul>
                    </div>
                  </td>
                </template>
              </tr>
            </template>
            <tr x-show="_loadErrored && displayJobs.length === 0">
              <td :colspan="columns.length" class="text-danger text-center">Failed to load jobs. <a href="#" @click.prevent="loadJobs()">Retry</a></td>
            </tr>
            <tr x-show="!_loadErrored && loaded && displayJobs.length === 0">
              <td :colspan="columns.length" class="text-muted text-center">No jobs found.</td>
            </tr>
          </tbody>
          <tbody x-html="TABLE_SKELETON_HTML"></tbody>
        </table>
      </div>

      <!-- Pagination (bottom) -->
      <div class="mb-4" x-show="loaded && totalPages > 1" x-html="PAGINATION_BOTTOM_HTML"></div>

      <!-- Job detail drawer. No backdrop, so the list stays readable and the
           arrows walk it without a close/reopen per job. -->
      <div class="offcanvas offcanvas-end detail-drawer" tabindex="-1" id="jobDetailDrawer"
           data-bs-backdrop="false" data-bs-scroll="true" :aria-label="detailTitle">
        <div class="offcanvas-header" x-html="DETAIL_HEAD_HTML"></div>
        <div class="offcanvas-body drawer-empty" x-show="detailError">
          <svg class="drawer-empty-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">

            <tr>
              <th class="sortable" @click="toggleSort('prefix')" @keydown.enter.prevent="toggleSort('prefix')" @keydown.space.prevent="toggleSort('prefix')" tabindex="0" :aria-sort="ariaSort('prefix')">Prefix<span class="sort-caret" x-text="sortIndicator('prefix')" aria-hidden="true"></span></th>
              <th class="sortable" @click="toggleSort('limit')" @keydown.enter.prevent="toggleSort('limit')" @keydown.space.prevent="toggleSort('limit')" tabindex="0" :aria-sort="ariaSort('limit')">Limit<span class="sort-caret" x-text="sortIndicator('limit')" aria-hidden="true"></span></th>
              <th class="sortable" @click="toggleSort('keys')" @keydown.enter.prevent="toggleSort('keys')" @keydown.space.prevent="toggleSort('keys')" tabindex="0" :aria-sort="ariaSort('keys')">Keys<span class="sort-caret" x-text="sortIndicator('keys')" aria-hidden="true"></span></th>
              <th class="sortable" @click="toggleSort('inFlight')" @keydown.enter.prevent="toggleSort('inFlight')" @keydown.space.prevent="toggleSort('inFlight')" tabindex="0" :aria-sort="ariaSort('inFlight')">In flight<span class="sort-caret" x-text="sortIndicator('inFlight')" aria-hidden="true"></span></th>
              <th class="sortable" @click="toggleSort('busiest')" @keydown.enter.prevent="toggleSort('busiest')" @keydown.space.prevent="toggleSort('busiest')" tabindex="0" :aria-sort="ariaSort('busiest')">Busiest key<span class="sort-caret" x-text="sortIndicator('busiest')" aria-hidden="true"></span></th>
            </tr>
          </thead>
          <template x-for="p in displayPolicies" :key="p.prefix">
            <tbody>
              <tr class="detail-row" :class="{ 'policy-bad': isSaturated(p) }" @click="rowClick($event, p)"
                tabindex="0" :aria-expanded="expandedPrefix === p.prefix"
                @keydown.enter.prevent="toggleKeys(p)" @keydown.space.prevent="toggleKeys(p)">
                <td class="text-break">
                  <span class="drill-caret" x-text="expandedPrefix === p.prefix ? '\u25be' : '\u25b8'"></span>
                  <span x-text="p.prefix"></span>
                  <span x-show="hasOverride(p)" class="badge bg-info-subtle text-info-emphasis ms-1">override</span>
                </td>
                <td x-text="effLimit(p)"></td>
                <td x-text="p.keyCount"></td>
                <td x-text="p.totalInFlight"></td>
                <td>
                  <template x-if="p.keyCount > 0 && !isIdle(p)">
                    <div class="d-flex align-items-center gap-2" :title="busiestTitle(p)">
                      <div class="progress flex-grow-1" style="height: 16px;">
                        <div class="progress-bar" :class="busiestClass(p)" :style="`width: ${busiestPct(p)}%`"></div>
                      </div>
                      <span class="small text-muted text-end" style="width: 3.5rem;" x-text="busiestLabel(p)"></span>
                    </div>
                  </template>
                  <span x-show="p.keyCount > 0 && isIdle(p)" class="text-muted small"
                    :title="`No key is holding a slot of ${effLimit(p)}`">idle</span>
                  <span x-show="p.keyCount === 0" class="text-muted">no keys</span>
                </td>
              </tr>
              <template x-if="expandedPrefix === p.prefix">
                <tr class="drill-row">
                  <td colspan="5" class="p-0">
                    <div class="drill-child">
                      <div class="inline-edit arb-edit">
                        <div class="inline-edit-fields">
                          <div class="edit-field">
                            <div class="form-check form-switch">
                              <input class="form-check-input" type="checkbox" id="ccLimitOn" x-model="edit.limitOn">
                              <label class="form-check-label" for="ccLimitOn">Concurrent limit per key</label>
                            </div>
                            <input type="number" min="0" step="1" class="form-control form-control-sm" x-model="edit.limit" :disabled="!edit.limitOn"
                              @keydown.enter.prevent="saveEdit()" :placeholder="`default ${edit.defaultLimit}`">
                          </div>
                          <div class="edit-actions">
                            <button type="button" class="btn btn-primary btn-sm" @click="saveEdit()" :disabled="edit.saving">Save</button>
                          </div>
                        </div>
                        <p class="edit-note">A lower limit does not preempt in-flight jobs. It applies as they drain. Uncheck to revert to the declared default.</p>
                        <div class="alert alert-danger py-2" x-show="edit.error" x-text="edit.error"></div>
                      </div>
                      <div class="table-responsive">
                        <table class="table table-sm drill-table" style="table-layout: fixed; width: 100%;">
                          <colgroup><col style="width: 50%"><col style="width: 20%"><col style="width: 30%"></colgroup>
                          <thead><tr><th>Key</th><th>In flight</th><th>Fill</th></tr></thead>
                          <tbody>
                            <template x-for="k in keys" :key="k.key">
                              <tr>
                                <td class="text-break"><code x-text="k.key"></code></td>
                                <td><span x-text="k.inFlight"></span> / <span x-text="k.effectiveLimit"></span></td>
                                <td>
                                  <div class="d-flex align-items-center gap-2">
                                    <div class="progress flex-grow-1" style="height: 14px;">
                                      <div class="progress-bar" :class="keyFillClass(k)" :style="`width: ${keyFillPct(k)}%`"></div>
                                    </div>
                                    <span class="small text-muted text-end" style="width: 2.75rem;" x-text="keyFillPct(k) + '%'"></span>
                                  </div>
                                </td>
                              </tr>
                            </template>
                            <template x-for="i in (keysLoading ? expectedItems() : 0)" :key="'sk-' + i">
                              <tr><td colspan="3" class="drill-loading text-muted text-center"><span class="skeleton-bar"></span></td></tr>
                            </template>
                            <tr x-show="!keysLoading && keys.length === 0"><td colspan="3" class="text-muted text-center">No active keys for this prefix.</td></tr>
                            <tr x-show="!keysLoading && hasMoreItems()"><td colspan="3" class="text-muted small text-center" x-text="`showing ${itemCap} of ${itemTotal()}`"></td></tr>
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </template>
          <tbody>
            <tr x-show="!loading && _loadErrored && policies.length === 0"><td colspan="5" class="text-danger text-center">Failed to load concurrency pools. <a href="#" @click.prevent="loadPolicies()">Retry</a></td></tr>
            <tr x-show="!loading && !_loadErrored && loaded && policies.length === 0"><td colspan="5" class="text-muted text-center">No concurrency pools declared.</td></tr>
          </tbody>
          <tbody x-html="TABLE_SKELETON_HTML"></tbody>
        </table>
      </div>
    </div>
    </div>
  </template>
</main>

<!-- Toast container -->
<!-- Cron modals, shared by the per-queue Cron tab and the global Cron overview. -->
<div class="modal fade" id="cronToggleModal" tabindex="-1" aria-labelledby="cronToggleModalLabel">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="cronToggleModalLabel">Disable schedule <code x-text="$store.cronEdit.confirmTarget"></code></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Disabling stops scheduled ticks for this schedule. Manual runs are refused until it is re-enabled.</p>
        <label class="form-label small">Type the schedule name <code x-text="$store.cronEdit.confirmTarget"></code> to confirm:</label>
        <input type="text" class="form-control form-control-sm" x-model="$store.cronEdit.confirmText" autocomplete="off" spellcheck="false"
               @keydown.enter.prevent="$store.cronEdit.confirmToggleEnabled()" :placeholder="$store.cronEdit.confirmTarget">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning btn-sm" @click="$store.cronEdit.confirmToggleEnabled()" :disabled="!$store.cronEdit.confirmValid() || $store.cronEdit.isHostBusy($store.cronEdit.confirmTarget)">Disable schedule</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  // Fix Bootstrap aria-hidden warning: blur focus before modal hides
  document.addEventListener('hide.bs.modal', (e) => {
    if (e.target.contains(document.activeElement)) document.activeElement.blur();
  });
</script>

<script src="js/stats.js"></script>
<script src="js/jobs.js"></script>
<script src="js/dlq.js"></script>
<script src="js/archive.js"></script>
<script src="js/events.js"></script>
<script src="vendor/cronstrue.min.js"></script>
<script src="js/cron.js"></script>
<script src="js/workers.js"></script>
<script src="js/ratelimits.js"></script>
<script src="js/concurrency.js"></script>

</body>
