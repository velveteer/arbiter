<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arbiter Admin</title>
  <script>
    document.documentElement.setAttribute('data-bs-theme',
      localStorage.getItem('arbiter-theme') || 'dark');
  </script>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="vendor/fonts/electrolize.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body x-cloak x-data>

<!-- Global top-bar loader for initial view loads -->
<div class="top-loader" x-show="$store.app.showLoader" x-cloak role="status" aria-label="Loading"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">A R B I T E R</a>

    <!-- Primary nav: the queue area plus the instance-wide singletons -->
    <nav class="nav-primary" aria-label="Primary">
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'queues' }"
        @click="$store.app.setView('queues')">Queues</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'ratelimits' }"
        @click="$store.app.setView('ratelimits')">Rate Limits</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'concurrency' }"
        @click="$store.app.setView('concurrency')">Concurrency</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'cron' }"
        @click="$store.app.setView('cron')">Cron</button>
      <button type="button" class="nav-primary-link" :class="{ active: $store.app.view === 'events' }"
        @click="$store.app.setView('events')">Events</button>
    </nav>

    <!-- Controls: SSE status, theme -->
    <div class="nav-controls d-flex align-items-center gap-3 ms-auto">
      <!-- SSE status indicator -->
      <span class="sse-status" role="status"
        :class="$store.app.sseDisabled ? 'polling' : ($store.app.connected ? 'connected' : 'disconnected')"
        :title="$store.app.sseDisabled ? 'Live updates unavailable — polling for changes' : ($store.app.connected ? 'Live updates connected' : 'Disconnected — reconnecting, polling for changes')"
        :aria-label="$store.app.sseDisabled ? 'Updates: polling' : ($store.app.connected ? 'Updates: live' : 'Updates: reconnecting')">
        <span class="sse-dot" aria-hidden="true"></span>
      </span>

      <!-- Theme toggle -->
      <button class="btn btn-sm nav-theme-toggle" @click="$store.app.toggleTheme()"
        :title="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        :aria-label="$store.app.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'">
        <span x-show="$store.app.theme === 'dark'">&#9788;</span>
        <span x-show="$store.app.theme !== 'dark'">&#9789;</span>
      </button>
    </div>
  </div>
</nav>

<!-- Main content -->
<div class="container-fluid mt-3">
  <!-- ============================================================ -->
  <!-- Area: Queue list (landing) — shown when no queue is drilled into -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'queues' && !$store.app.selectedQueue && !$store.app._deepLinkPending">
    <div x-data="queueListTab">
      <div class="queue-grid">
        <template x-for="r in rows" :key="r.queue">
          <div class="queue-card" :class="{ 'is-throttled': r.stats?.throttledJobs > 0, 'is-paused': r.paused }">
            <a class="queue-card-head" :href="queueUrl(r.queue)" @click="navTo($event, r.queue)">
              <span class="queue-card-name" x-text="r.queue" :title="r.queue"></span>
              <span class="queue-card-arrow" aria-hidden="true">&rarr;</span>
            </a>
            <template x-if="pauseState(r)">
              <div class="queue-card-pause" :class="'is-' + pauseState(r).key" x-text="pauseState(r).label"></div>
            </template>

            <div class="queue-card-body">
              <a class="queue-card-hero" :href="queueUrl(r.queue, 'ready')" @click="navTo($event, r.queue, 'ready')">
                <span class="queue-card-ready" x-text="fmtCount(r.stats?.readyJobs)"></span>
                <span class="queue-card-ready-label">ready</span>
              </a>
              <div class="queue-card-stats">
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'in_flight')" @click="navTo($event, r.queue, 'in_flight')">
                  <span class="qc-val" x-text="fmtCount(r.stats?.inFlightJobs)"></span><span class="qc-lbl">in-flight</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'scheduled')" @click="navTo($event, r.queue, 'scheduled')">
                  <span class="qc-val" x-text="fmtCount(r.stats?.scheduledJobs)"></span><span class="qc-lbl">scheduled</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'backoff')" @click="navTo($event, r.queue, 'backoff')">
                  <span class="qc-val" x-text="fmtCount(r.stats?.backoffJobs)"></span><span class="qc-lbl">backoff</span>
                </a>
                <a class="queue-card-stat" :href="queueUrl(r.queue, 'throttled')" @click="navTo($event, r.queue, 'throttled')">
                  <span class="qc-val" :class="{ warn: r.stats?.throttledJobs > 0 }" x-text="fmtCount(r.stats?.throttledJobs)"></span><span class="qc-lbl">throttled</span>
                </a>
              </div>
              <div class="queue-card-oldest">
                <span>oldest ready</span>
                <span x-text="r.stats?.oldestReadyAgeSeconds != null ? Math.round(r.stats.oldestReadyAgeSeconds) + 's' : '—'"></span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="queue-list-empty" x-show="_loadErrored && rows.length === 0">Failed to load queues. <a href="#" @click.prevent="load()">Retry</a></div>
      <div class="queue-list-empty" x-show="loaded && !_loadErrored && rows.length === 0">No queues available.</div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- Area: Queue detail — the drilled-into queue's scoped sub-tabs -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'queues' && $store.app.selectedQueue">
    <div x-init="$nextTick(() => activateSubTabFromHash(['stats','jobs','dlq','cron','workers']))">
      <!-- Breadcrumb + quick switcher + pause -->
      <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#" @click.prevent="$store.app.setView('queues')">Queues</a></li>
            <li class="breadcrumb-item active" aria-current="page" x-text="$store.app.selectedQueue"></li>
          </ol>
        </nav>
        <div class="dropdown" x-show="$store.app.queues.length > 1">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" title="Switch queue">Switch</button>
          <ul class="dropdown-menu">
            <template x-for="q in $store.app.queues" :key="q">
              <li>
                <a class="dropdown-item" href="#" @click.prevent="$store.app.openQueue(q)" x-text="q"
                  :class="{ 'active': q === $store.app.selectedQueue }"></a>
              </li>
            </template>
          </ul>
        </div>
        <div class="ms-auto d-flex align-items-center gap-3" x-data="queuePauseToggle">
          <span x-show="paused" class="badge paused-badge" :title="pausedAt ? formatTime(pausedAt) : ''">
            queue paused<template x-if="pausedAgeStr"><span class="ms-1 fw-normal" x-text="'(' + pausedAgeStr + ')'"></span></template>
          </span>
          <button class="btn btn-sm text-nowrap" x-show="showPauseToggle" :class="isArmed('toggle') ? 'btn-warning' : (paused ? 'btn-success' : 'btn-outline-warning')"
                  :disabled="busy" @click="onToggle()"
                  x-text="isArmed('toggle') ? 'Click to confirm' : (paused ? 'Resume queue' : 'Pause queue')"></button>

          <!-- Type-to-confirm pause (ARB_CONFIG.pauseConfirm === 'type'). -->
          <div class="modal fade" id="pauseConfirmModal" tabindex="-1" aria-labelledby="pauseConfirmModalLabel">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header">
                  <h5 class="modal-title" id="pauseConfirmModalLabel">Pause queue <code x-text="$store.app.selectedQueue"></code></h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  <p class="text-muted small mb-3">Pausing stops all workers from claiming jobs in this queue until it is resumed. In-flight jobs finish, new ones wait.</p>
                  <label class="form-label small">Type the queue name <code x-text="$store.app.selectedQueue"></code> to confirm:</label>
                  <input type="text" class="form-control form-control-sm" x-model="confirmText" autocomplete="off" spellcheck="false"
                         @keydown.enter.prevent="confirmPause()" :placeholder="$store.app.selectedQueue">
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                  <button type="button" class="btn btn-warning btn-sm" @click="confirmPause()" :disabled="!confirmValid() || busy">Pause queue</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-stats" type="button" role="tab">Stats</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-jobs" type="button" role="tab">Jobs</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-dlq" type="button" role="tab">DLQ</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cron" type="button" role="tab">Cron</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-workers" type="button" role="tab">Workers</button>
        </li>
      </ul>

      <div class="tab-content mt-3">
    <!-- Stats Tab -->
    <div class="tab-pane fade" id="tab-stats" role="tabpanel" x-data="statsTab">
      <div class="row g-3" x-show="$store.app.selectedQueue">
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" :href="jobsUrl('')" @click="goToJobs($event, '')">
            <div class="card-body">
              <h5 class="card-title text-muted">Total Jobs</h5>
              <p class="display-6" x-text="stats?.totalJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" :href="jobsUrl('ready')" @click="goToJobs($event, 'ready')">
            <div class="card-body">
              <h5 class="card-title text-muted">Ready</h5>
              <p class="display-6" x-text="stats?.readyJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" title="Jobs currently leased by a worker" :href="jobsUrl('in_flight')" @click="goToJobs($event, 'in_flight')">
            <div class="card-body">
              <h5 class="card-title text-muted">In-Flight</h5>
              <p class="display-6" x-text="stats?.inFlightJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" title="Jobs delayed until a future time, not yet attempted" :href="jobsUrl('scheduled')" @click="goToJobs($event, 'scheduled')">
            <div class="card-body">
              <h5 class="card-title text-muted">Scheduled</h5>
              <p class="display-6" x-text="stats?.scheduledJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" title="Failed jobs waiting out a retry backoff delay" :href="jobsUrl('backoff')" @click="goToJobs($event, 'backoff')">
            <div class="card-body">
              <h5 class="card-title text-muted">Backoff</h5>
              <p class="display-6" x-text="stats?.backoffJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" title="Jobs parked by a rate limit until tokens refill" :href="jobsUrl('throttled')" @click="goToJobs($event, 'throttled')">
            <div class="card-body">
              <h5 class="card-title text-muted">Throttled</h5>
              <p class="display-6" x-text="stats?.throttledJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <a class="card text-center stat-card" title="Suspended jobs (e.g. rollup finalizers awaiting children)" :href="jobsUrl('suspended')" @click="goToJobs($event, 'suspended')">
            <div class="card-body">
              <h5 class="card-title text-muted">Suspended</h5>
              <p class="display-6" x-text="stats?.suspendedJobs ?? '-'"></p>
            </div>
          </a>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card text-center" title="Age of the oldest job currently ready to claim">
            <div class="card-body">
              <h5 class="card-title text-muted">Oldest Ready (s)</h5>
              <p class="display-6" x-text="stats?.oldestReadyAgeSeconds != null ? Math.round(stats.oldestReadyAgeSeconds) : '-'"></p>
            </div>
          </div>
        </div>
      </div>
      <div x-show="$store.app.initialized && !$store.app.selectedQueue" class="text-muted mt-3">No queues available.</div>
    </div>

    <!-- Jobs Tab -->
    <div class="tab-pane fade" id="tab-jobs" role="tabpanel" x-data="jobsTab">
      <!-- Toolbar -->
      <div class="toolbar d-flex flex-wrap gap-2 mb-3 align-items-center">
        <!-- Filters -->
        <div class="position-relative" style="max-width: 220px;">
          <input type="text" class="form-control form-control-sm pe-4" :class="{ 'filter-dirty': groupKeyFilter !== _appliedGroupKey }"
            placeholder="Group key..." aria-label="Filter by group key"
            x-model="groupKeyFilter" @keyup.enter="applyFilter()" @change="applyFilter()" @keyup.escape="groupKeyFilter = ''; applyFilter()">
          <button class="btn btn-sm position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-2 text-muted"
            x-show="groupKeyFilter" @mousedown.prevent @click="groupKeyFilter = ''; applyFilter()" title="Clear filter" aria-label="Clear filter"
            style="line-height: 1; font-size: .75rem; opacity: .6;"
            @mouseenter="$el.style.opacity=1" @mouseleave="$el.style.opacity=.6">&#x2715;</button>
        </div>
        <div class="position-relative" style="max-width: 160px;">
          <input type="text" class="form-control form-control-sm pe-4" :class="{ 'filter-dirty': parentIdFilter !== _appliedParentId }"
            placeholder="Parent ID..." aria-label="Filter by parent ID"
            x-model="parentIdFilter" @keyup.enter="applyFilter()" @change="applyFilter()" @keyup.escape="parentIdFilter = ''; applyFilter()">
          <button class="btn btn-sm position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-2 text-muted"
            x-show="parentIdFilter" @mousedown.prevent @click="parentIdFilter = ''; applyFilter()" title="Clear filter" aria-label="Clear filter"
            style="line-height: 1; font-size: .75rem; opacity: .6;"
            @mouseenter="$el.style.opacity=1" @mouseleave="$el.style.opacity=.6">&#x2715;</button>
        </div>
        <select class="form-select form-select-sm" style="width: auto;" title="Filter by job state" aria-label="Filter by job state"
          x-model="stateFilter" @change="applyState()">
          <option value="">All states</option>
          <option value="ready">Ready</option>
          <option value="in_flight">In-flight</option>
          <option value="backoff">Backoff</option>
          <option value="scheduled">Scheduled</option>
          <option value="throttled">Throttled</option>
          <option value="suspended">Suspended</option>
        </select>

        <!-- View -->
        <button class="btn btn-sm" :class="effectiveViewMode === 'tree' ? 'btn-primary' : 'btn-outline-primary'"
          @click="toggleViewMode()"
          :disabled="!!stateFilter"
          :title="stateFilter ? 'A status filter always renders flat' : effectiveViewMode === 'tree' ? 'Tree view: children hidden until expanded' : 'Flat view: all jobs shown'">
          <span x-text="effectiveViewMode === 'tree' ? 'Tree' : 'Flat'"></span>
        </button>

        <!-- Columns -->
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Show/hide columns">Columns</button>
          <ul class="dropdown-menu p-2" style="min-width: 12rem;">
            <template x-for="c in columns.filter((col) => !col.required)" :key="c.key">
              <li>
                <label class="dropdown-item d-flex align-items-center gap-2 mb-0">
                  <input type="checkbox" class="form-check-input mt-0" :checked="colVisible(c.key)" @change="toggleCol(c.key)">
                  <span x-text="c.label"></span>
                </label>
              </li>
            </template>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" @click="resetColumns()">Reset to defaults</button></li>
          </ul>
        </div>

        <!-- Actions -->
        <div class="ms-auto d-flex gap-2 align-items-center">
          <button class="btn btn-outline-success btn-sm" @click="showInsertForm = !showInsertForm; insertError = ''">+ Insert</button>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" :disabled="loading" @click="loadJobs()" title="Refresh now" aria-label="Refresh now"><span :class="{ spin: polling }">&#x21bb;</span></button>
            <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Auto-refresh interval">
              <span x-text="refreshMode === 'paused' ? 'Off' : refreshMode"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" :class="{ active: refreshMode === '1s' }" href="#" @click.prevent="setRefreshMode('1s')">Every 1s</a></li>
              <li><a class="dropdown-item" :class="{ active: refreshMode === '5s' }" href="#" @click.prevent="setRefreshMode('5s')">Every 5s</a></li>
              <li><a class="dropdown-item" :class="{ active: refreshMode === '10s' }" href="#" @click.prevent="setRefreshMode('10s')">Every 10s</a></li>
              <li><a class="dropdown-item" :class="{ active: refreshMode === '30s' }" href="#" @click.prevent="setRefreshMode('30s')">Every 30s</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" :class="{ active: refreshMode === 'paused' }" href="#" @click.prevent="setRefreshMode('paused')">Off</a></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="text-info small mb-2" x-show="refreshMode === 'paused' && pendingChanges > 0" x-text="pendingChanges + ' changes pending'"></div>

      <!-- Insert Form -->
      <div class="card mb-3" x-show="showInsertForm">
        <div class="card-body">
          <h6 class="card-title">Insert New Job</h6>
          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Payload (JSON)</label>
              <textarea class="form-control font-monospace" rows="3" x-model="insertPayload" :class="{ 'is-invalid': insertPayloadInvalid }"></textarea>
              <small class="text-danger" x-show="insertPayloadInvalid">Invalid JSON</small>
            </div>
            <div class="col-md-2">
              <label class="form-label">Group Key</label>
              <input type="text" class="form-control" x-model="insertGroupKey" placeholder="Optional">
            </div>
            <div class="col-md-2">
              <label class="form-label">Dedup Key</label>
              <input type="text" class="form-control" x-model="insertDedupKey" placeholder="Optional">
            </div>
            <div class="col-md-1" x-show="insertDedupKey">
              <label class="form-label">Strategy</label>
              <select class="form-select" x-model="insertDedupStrategy">
                <option value="ignore">Ignore</option>
                <option value="replace">Replace</option>
              </select>
            </div>
            <div class="col-md-1">
              <label class="form-label">Priority</label>
              <input type="number" class="form-control" x-model="insertPriority">
            </div>
            <div class="col-md-3">
              <label class="form-label">Scheduled For</label>
              <input type="datetime-local" class="form-control" x-model="insertNotVisibleUntil" title="Optional: the job stays scheduled and is not claimable until this local time">
            </div>
            <div class="col-md-2">
              <label class="form-label">Max Attempts</label>
              <input type="number" min="1" class="form-control" x-model="insertMaxAttempts" placeholder="Default">
            </div>
          </div>
          <div class="mt-2 d-flex align-items-center gap-2">
            <button class="btn btn-primary btn-sm" @click="submitInsert()" :disabled="inserting">
              <span x-text="inserting ? 'Inserting…' : 'Insert'"></span>
            </button>
            <small class="alert alert-danger mb-0 inline-error" x-show="insertError" x-text="insertError"></small>
          </div>
        </div>
      </div>

      <!-- Pagination (top) -->
      <div class="align-items-center gap-2 mb-2" :class="loaded ? 'd-flex' : 'd-none'">
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" :disabled="currentPage === 1" @click="prevPage()">Prev</button>
          <button class="btn btn-outline-secondary" :disabled="currentPage >= totalPages" @click="nextPage()">Next</button>
        </div>
        <span class="text-muted small" x-text="total + ' jobs \u00b7 page ' + currentPage + ' of ' + totalPages"></span>
        <input type="number" class="form-control form-control-sm" style="width: 70px;" min="1" :max="totalPages"
          :placeholder="currentPage" @keyup.enter="goToPage($el.value); $el.value = ''" title="Jump to page" aria-label="Jump to page">
      </div>

      <!-- Jobs table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover table-sm" style="table-layout: fixed; width: 100%;">
          <thead>
            <tr>
              <th class="sortable" :style="'width:' + colPct('id') + '%'" @click="toggleSort('id')" @keydown.enter.prevent="toggleSort('id')" @keydown.space.prevent="toggleSort('id')" tabindex="0" :aria-sort="sortBy === 'id' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">ID<span x-text="sortIndicator('id')" aria-hidden="true"></span></th>
              <th :class="{ 'd-none': !colVisible('payload') }" :style="'width:' + colPct('payload') + '%'">Payload</th>
              <th class="sortable" :class="{ 'd-none': !colVisible('group') }" :style="'width:' + colPct('group') + '%'" @click="toggleSort('group_key')" @keydown.enter.prevent="toggleSort('group_key')" @keydown.space.prevent="toggleSort('group_key')" tabindex="0" :aria-sort="sortBy === 'group_key' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Group<span x-text="sortIndicator('group_key')" aria-hidden="true"></span></th>
              <th class="sortable" :class="{ 'd-none': !colVisible('parent') }" :style="'width:' + colPct('parent') + '%'" @click="toggleSort('parent_id')" @keydown.enter.prevent="toggleSort('parent_id')" @keydown.space.prevent="toggleSort('parent_id')" tabindex="0" :aria-sort="sortBy === 'parent_id' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Parent<span x-text="sortIndicator('parent_id')" aria-hidden="true"></span></th>
              <th :class="{ 'd-none': !colVisible('children') }" :style="'width:' + colPct('children') + '%'">Children</th>
              <th class="sortable" :class="{ 'd-none': !colVisible('priority') }" :style="'width:' + colPct('priority') + '%'" @click="toggleSort('priority')" @keydown.enter.prevent="toggleSort('priority')" @keydown.space.prevent="toggleSort('priority')" tabindex="0" :aria-sort="sortBy === 'priority' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Priority<span x-text="sortIndicator('priority')" aria-hidden="true"></span></th>
              <th class="sortable" :class="{ 'd-none': !colVisible('attempts') }" :style="'width:' + colPct('attempts') + '%'" @click="toggleSort('attempts')" @keydown.enter.prevent="toggleSort('attempts')" @keydown.space.prevent="toggleSort('attempts')" tabindex="0" :aria-sort="sortBy === 'attempts' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Attempts<span x-text="sortIndicator('attempts')" aria-hidden="true"></span></th>

              <th class="sortable" :class="{ 'd-none': !colVisible('visible') }" :style="'width:' + colPct('visible') + '%'" @click="toggleSort('not_visible_until')" @keydown.enter.prevent="toggleSort('not_visible_until')" @keydown.space.prevent="toggleSort('not_visible_until')" tabindex="0" :aria-sort="sortBy === 'not_visible_until' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">
                <span x-text="notVisibleFormat === 'countdown' ? 'Visible In' : 'Visible At'"></span><span x-text="sortIndicator('not_visible_until')" aria-hidden="true"></span>

          </thead>
          <tbody>
            <template x-for="job in displayJobs" :key="String(job.primaryKey) + '-' + job._depth">

                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate"
                    :style="job._depth ? 'background: linear-gradient(to right, color-mix(in srgb, var(--arb-teal-dim) 35%, transparent) ' + (job._depth * 12) + 'px, transparent ' + (job._depth * 12 + 6) + 'px)' : ''"
                    x-text="job.primaryKey"></td>
                </template>
                <template x-if="!job._isMoreRow">

                  <td class="text-truncate" x-show="colVisible('group')" x-text="job.groupKey || '-'"></td>

                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('parent')">

                      <a href="#" class="text-decoration-none"

                    </template>
                    <template x-if="!job.parentId">
                      <span>-</span>
                    </template>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                <td x-show="colVisible('children')">
                  <template x-if="job._childCount || job._dlqChildCount">
                    <span class="d-inline-flex gap-1 flex-wrap align-items-center">
                      <template x-if="job._childCount">
                        <span class="d-inline-flex align-items-center gap-1">

                            <a href="#" class="text-decoration-none d-inline-flex align-items-center gap-1"

                          <template x-if="effectiveViewMode !== 'tree'">
                            <span class="text-muted small"

                  </template>
                  <template x-if="!job._childCount && !job._dlqChildCount">
                    <span>-</span>
                  </template>
                </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('priority')" x-text="job.priority"></td>
                </template>
                <template x-if="!job._isMoreRow">

                <template x-if="!job._isMoreRow">

                    <span class="badge"

                        'bg-primary-subtle text-primary-emphasis': job.status === 'in_flight',
                        'bg-danger-subtle text-danger-emphasis': job.status === 'backoff',
                        'bg-secondary-subtle text-secondary-emphasis': job.status === 'scheduled',
                        'bg-info-subtle text-info-emphasis': job.status === 'throttled',
                        'bg-success-subtle text-success-emphasis': job.status === 'ready',
                      }"
                      x-text="job.status"></span>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate" x-show="colVisible('inserted')" :title="job.insertedAt" x-text="formatTime(job.insertedAt, '-')"></td>

                <template x-if="!job._isMoreRow">
                  <td class="text-truncate font-monospace" x-show="colVisible('visible')">
                    <span class="format-toggle-cell" tabindex="0" role="button"
                          @click="toggleNotVisibleFormat()"
                          @keydown.enter.prevent="toggleNotVisibleFormat()"
                          @keydown.space.prevent="toggleNotVisibleFormat()"
                          :title="job.notVisibleUntil ? 'Click to switch format · ' + (notVisibleFormat === 'countdown' ? formatTime(job.notVisibleUntil) : formatCountdown(job.notVisibleUntil)) : 'Click to switch format'"
                          x-text="formatNotVisible(job.notVisibleUntil)"></span>
                  </td>
                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate font-monospace" x-show="colVisible('ratelimit')"

                </template>
                <template x-if="!job._isMoreRow">
                  <td class="text-truncate font-monospace" x-show="colVisible('concurrency')"

                </template>
                <template x-if="!job._isMoreRow">
                  <td x-show="colVisible('actions')">
                    <div class="d-inline-flex gap-1 flex-nowrap">
                      <button class="btn btn-outline-primary btn-sm" @click="viewDetail(job.primaryKey)" title="View">Detail</button>
                      <div class="dropdown">
                        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" :disabled="isBusy(job.primaryKey)">
                          Actions
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                          <li x-show="job.status === 'scheduled' || job.status === 'backoff'">
                            <a class="dropdown-item" href="#" @click.prevent="promoteJob(job.primaryKey); closeDropdown($el)">Promote</a>
                          </li>
                          <li>
                            <a class="dropdown-item" href="#" @click.prevent="cancelJob(job.primaryKey, $el)" :class="{ 'text-warning fw-semibold': isArmed('cancel:' + job.primaryKey) }" x-text="isArmed('cancel:' + job.primaryKey) ? ('Confirm cancel' + (job._childCount ? ' (+' + job._childCount + ' children)' : '')) : 'Cancel'"></a>
                          </li>
                          <li x-show="job.status === 'in_flight'">
                            <a class="dropdown-item text-danger" href="#" @click.prevent="forceCancelJob(job.primaryKey, $el)" :class="{ 'fw-semibold': isArmed('fcancel:' + job.primaryKey) }" x-text="isArmed('fcancel:' + job.primaryKey) ? 'Confirm force-cancel (interrupts handler)' : 'Force Cancel'"></a>
                          </li>
                          <li>
                            <a class="dropdown-item" href="#" @click.prevent="moveToDLQ(job.primaryKey, $el)" :class="{ 'text-warning fw-semibold': isArmed('movedlq:' + job.primaryKey) }" x-text="isArmed('movedlq:' + job.primaryKey) ? ('Confirm move to DLQ' + (job._childCount ? ' (+' + job._childCount + ' children)' : '')) : 'Move to DLQ'"></a>
                          </li>
                          <li><hr class="dropdown-divider"></li>
                          <li x-show="canSuspend(job)">
                            <a class="dropdown-item" href="#" @click.prevent="pauseAction(job); closeDropdown($el)" x-text="job._childCount > 0 ? 'Pause descendants' : 'Suspend'"></a>
                          </li>
                          <li x-show="canResume(job)">
                            <a class="dropdown-item" href="#" @click.prevent="resumeAction(job); closeDropdown($el)" x-text="job._childCount > 0 ? 'Resume descendants' : 'Resume'"></a>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </td>
                </template>
              </tr>
            </template>
            <tr x-show="_loadErrored && displayJobs.length === 0">

            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination (bottom) -->
      <div class="align-items-center gap-2 mb-4" :class="loaded ? 'd-flex' : 'd-none'">

          <button class="btn btn-outline-secondary" :disabled="currentPage === 1" @click="prevPage()">Prev</button>
          <button class="btn btn-outline-secondary" :disabled="currentPage >= totalPages" @click="nextPage()">Next</button>
        </div>
        <span class="text-muted small" x-text="'Page ' + currentPage + ' of ' + totalPages"></span>

                <dd class="col-sm-8" x-text="selectedJob?.priority"></dd>
                <dt class="col-sm-4">Attempts</dt>
                <dd class="col-sm-8" x-text="selectedJob?.attempts"></dd>
                <dt class="col-sm-4">Max Attempts</dt>
                <dd class="col-sm-8" x-text="selectedJob?.maxAttempts ?? '-'"></dd>

                <dd class="col-sm-8" x-text="formatTime(selectedJob?.updatedAt, '-')"></dd>

                <dd class="col-sm-8" x-text="formatTime(selectedJob?.lastAttemptedAt, '-')"></dd>

            style="line-height: 1; font-size: .75rem; opacity: .6;"
            @mouseenter="$el.style.opacity=1" @mouseleave="$el.style.opacity=.6">&#x2715;</button>
        </div>
        <div class="position-relative" style="max-width: 160px;">
          <input type="text" class="form-control form-control-sm pe-4" :class="{ 'filter-dirty': parentIdFilter !== _appliedParentId }"

          <button class="btn btn-sm position-absolute top-50 end-0 translate-middle-y border-0 p-0 me-2 text-muted"

              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" :class="{ active: refreshMode === 'paused' }" href="#" @click.prevent="setRefreshMode('paused')">Off</a></li>
            </ul>
          </div>
        </div>
      </div>

        <button class="btn btn-sm" :class="isArmed('bulkDelete') ? 'btn-danger' : 'btn-outline-danger'" :disabled="bulkBusy" @click="bulkDelete()" x-text="isArmed('bulkDelete') ? ('Confirm delete ' + selectedCount + ' permanently') : 'Delete selected'"></button>

          <button class="btn btn-outline-secondary" :disabled="currentPage >= totalPages" @click="nextPage()">Next</button>

              <th class="sortable" :class="{ 'd-none': !colVisible('group') }" :style="'width:' + colPct('group') + '%'" @click="toggleSort('group_key')" @keydown.enter.prevent="toggleSort('group_key')" @keydown.space.prevent="toggleSort('group_key')" tabindex="0" :aria-sort="sortBy === 'group_key' ? (sortDir === 'asc' ? 'ascending' : 'descending') : 'none'">Group<span x-text="sortIndicator('group_key')" aria-hidden="true"></span></th>

                    <button class="btn btn-outline-primary btn-sm" @click="openEdit(p)">Edit</button>
                    <button class="btn btn-sm text-nowrap" :class="isArmed('reset:' + p.prefix) ? 'btn-warning' : 'btn-outline-danger'"
                      @click="resetPrefix(p)"
                      x-text="isArmed('reset:' + p.prefix) ? 'Confirm reset' : 'Reset'"></button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="!loading && _loadErrored && policies.length === 0"><td colspan="7" class="text-danger text-center">Failed to load rate limits. <a href="#" @click.prevent="loadPolicies()">Retry</a></td></tr>
            <tr x-show="!loading && !_loadErrored && loaded && policies.length === 0"><td colspan="7" class="text-muted text-center">No rate-limit policies declared.</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Bucket drill-down -->
      <div x-show="expandedPrefix" class="mt-2">
        <h6 class="mb-2">
          Buckets for <code x-text="expandedPrefix"></code>
          <span class="text-muted small fw-normal" x-show="hasMoreItems()"
            x-text="`showing ${itemCap} most-drained of ${itemTotal()}`"></span>
        </h6>
        <div class="table-responsive">
          <table class="table table-sm table-bordered" style="table-layout: fixed; width: 100%;">
            <colgroup><col style="width: 50%"><col style="width: 20%"><col style="width: 30%"></colgroup>
            <thead><tr><th>Key</th><th>Tokens</th><th>Fill</th></tr></thead>
            <tbody>
              <template x-for="b in buckets" :key="b.key">
                <tr>
                  <td class="text-break"><code x-text="b.key"></code></td>
                  <td><span x-text="fmtNum(b.tokens)"></span> / <span x-text="fmtNum(b.maxTokens)"></span></td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <div class="progress flex-grow-1" style="height: 14px;">
                        <div class="progress-bar" :class="bucketFillClass(b)" :style="`width: ${bucketFillPct(b)}%`"></div>
                      </div>
                      <span class="small text-muted text-end" style="width: 2.75rem;" x-text="bucketFillPct(b) + '%'"></span>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="bucketsLoading"><td colspan="3" class="text-muted text-center">Loading…</td></tr>
              <tr x-show="!bucketsLoading && buckets.length === 0"><td colspan="3" class="text-muted text-center">No active buckets for this prefix.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit overrides modal -->
      <div class="modal fade" id="rateLimitEditModal" tabindex="-1" aria-labelledby="rateLimitEditModalLabel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="rateLimitEditModalLabel">Override <code x-text="edit.prefix"></code></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p class="text-muted small">Overrides take effect on the next consume. Uncheck a field to revert it to the declared default.</p>
              <div class="mb-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="rlMaxOn" x-model="edit.maxOn">
                  <label class="form-check-label" for="rlMaxOn">Max tokens (burst)</label>
                </div>
                <input type="number" min="0" step="any" class="form-control form-control-sm" x-model="edit.max" :disabled="!edit.maxOn"
                  @keydown.enter.prevent="saveEdit()" :placeholder="`default ${edit.defaultMax}`">
              </div>
              <div class="mb-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="rlRefillOn" x-model="edit.refillOn">
                  <label class="form-check-label" for="rlRefillOn">Refill amount</label>
                </div>
                <input type="number" min="0" step="any" class="form-control form-control-sm" x-model="edit.refill" :disabled="!edit.refillOn"
                  @keydown.enter.prevent="saveEdit()" :placeholder="`default ${edit.defaultRefill}`">
              </div>
              <div class="mb-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="rlIntervalOn" x-model="edit.intervalOn">
                  <label class="form-check-label" for="rlIntervalOn">Interval (seconds)</label>
                </div>
                <input type="number" min="0" step="any" class="form-control form-control-sm" x-model="edit.interval" :disabled="!edit.intervalOn"
                  @keydown.enter.prevent="saveEdit()" :placeholder="`default ${edit.defaultInterval}`">
              </div>
              <div class="alert alert-danger py-2 mb-0" x-show="edit.error" x-text="edit.error"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary btn-sm" @click="saveEdit()" :disabled="edit.saving">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- Area: Cron (instance-wide overview) -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'cron'">
    <div class="mt-3">
    <!-- Global cron overview: same component as the per-queue Cron tab, scoped to all queues. -->
    <div id="tab-cron-overview" x-data="cronTab({ global: true })">
      <div class="d-flex gap-2 mb-3 align-items-center">
        <button class="btn btn-outline-secondary btn-sm" :disabled="loading" @click="loadSchedules()"><span class="me-1" :class="{ spin: polling }">&#x21bb;</span>Refresh</button>
        <span class="text-muted small" x-show="loaded && schedules.length">
          <span x-text="schedules.length"></span> <span x-text="schedules.length === 1 ? 'schedule' : 'schedules'"></span> across all queues
        </span>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover table-sm" style="table-layout: fixed; width: 100%;">
          <colgroup>
            <col style="width: 10%">
            <col style="width: 10%">
            <col style="width: 15%">
            <col style="width: 9%">
            <col style="width: 10%">
            <col style="width: 5%">
            <col style="width: 15%">
            <col style="width: 12%">
            <col style="width: 14%">
          </colgroup>
          <thead>
            <tr>
              <th>Name</th>
              <th>Queue</th>
              <th>Expression</th>
              <th>Overlap Policy</th>
              <th>Timezone</th>
              <th>Enabled</th>
              <th>Last Fired At</th>
              <th>Last Checked</th>
              <th class="cell-actions">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="s in schedules" :key="s.name">
              <tr>
                <td class="text-truncate" x-text="s.name" :title="s.name"></td>

                <!-- Queue (drill into its detail view) -->
                <td class="text-truncate">
                  <a x-show="queueServed(s)" href="#" @click.prevent="openQueue(s.queueName)" x-text="s.queueName" :title="'Open ' + s.queueName"></a>
                  <span x-show="!queueServed(s)" class="text-muted" x-text="s.queueName"
                    :title="s.queueName + ' is not served by this server'"></span>
                </td>

                <!-- Expression -->
                <td>
                  <div class="d-flex flex-column gap-0">
                    <div class="d-flex flex-wrap align-items-center gap-1">
                      <span x-text="effectiveExpression(s)"></span>
                      <span x-show="isOverridden(s, 'expression')" class="badge bg-info-subtle text-info-emphasis">override</span>
                    </div>
                    <small class="text-muted" x-text="describeExpression(s)"></small>
                  </div>
                </td>

                <!-- Overlap -->
                <td>
                  <span x-text="effectiveOverlap(s)"></span>
                  <span x-show="isOverridden(s, 'overlap')" class="badge bg-info-subtle text-info-emphasis ms-1">override</span>
                </td>

                <!-- Timezone -->
                <td class="text-truncate">
                  <span x-text="effectiveTimezone(s) || 'UTC'"></span>
                  <span x-show="isOverridden(s, 'timezone')" class="badge bg-info-subtle text-info-emphasis ms-1">override</span>
                </td>

                <!-- Enabled toggle -->
                <td>
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" :checked="s.enabled"
                      :disabled="isBusy(s.name)"
                      @change="onToggleEnabled(s, $event)">
                  </div>
                </td>

                <td>
                  <div class="d-flex flex-column gap-0">
                    <span class="text-nowrap" x-text="formatTime(lastFired(s).at, 'Never')"></span>
                    <div class="d-flex flex-wrap align-items-center gap-1">
                      <span x-show="lastFired(s).manual" class="badge bg-secondary-subtle text-secondary-emphasis"
                        title="Last fired by a manual run, not the schedule">manual</span>
                      <span x-show="isRunPending(s)" class="badge bg-warning-subtle text-warning-emphasis"
                        title="A manual run is waiting for a worker pool to claim it">run pending</span>
                    </div>
                  </div>
                </td>
                <td class="text-nowrap" x-text="formatTime(s.lastCheckedAt, 'Never')"></td>

                <!-- Actions -->
                <td class="cell-actions">
                  <div class="d-inline-flex gap-2 flex-nowrap">
                    <button class="btn btn-outline-secondary btn-sm" :disabled="isBusy(s.name)" @click="openEdit(s)">Edit</button>
                    <button class="btn btn-sm text-nowrap" :class="isArmed('run:' + s.name) ? 'btn-primary' : 'btn-outline-primary'"
                      :disabled="isBusy(s.name) || !canRun(s)"
                      @click="runNow(s)" :title="runTitle(s)"
                      x-text="isArmed('run:' + s.name) ? 'Confirm run' : 'Run now'"></button>
                  </div>
                </td>
              </tr>
            </template>
            <tr x-show="_loadErrored && schedules.length === 0">
              <td colspan="9" class="text-danger text-center">Failed to load cron schedules. <a href="#" @click.prevent="loadSchedules()">Retry</a></td>
            </tr>
            <tr x-show="!_loadErrored && loaded && schedules.length === 0">
              <td colspan="9" class="text-muted text-center">No cron schedules configured.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
    </div>
  </template>

  <!-- ============================================================ -->
  <!-- Area: Concurrency (instance-wide) -->
  <!-- ============================================================ -->
  <template x-if="$store.app.view === 'concurrency'">
    <div class="mt-3">
    <!-- Concurrency Tab -->
    <div id="tab-concurrency" x-data="concurrencyTab">
      <div class="d-flex gap-2 mb-3 align-items-center">
        <button class="btn btn-outline-secondary btn-sm" :disabled="loading" @click="loadPolicies()"><span class="me-1" :class="{ spin: polling }">&#x21bb;</span>Refresh</button>
        <button class="btn btn-sm" :class="isArmed('reconcile') ? 'btn-warning' : 'btn-outline-secondary'"
          @click="reconcile()" x-text="isArmed('reconcile') ? 'Confirm reconcile' : 'Reconcile counts'"></button>
        <span class="text-muted small" x-show="loaded && policies.length">
          <span x-text="policies.length"></span> <span x-text="policies.length === 1 ? 'pool' : 'pools'"></span>
        </span>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover table-sm" style="table-layout: fixed; width: 100%;">
          <colgroup>
            <col style="width: 22%">
            <col style="width: 12%">
            <col style="width: 10%">
            <col style="width: 12%">
            <col style="width: 26%">
            <col style="width: 18%">
          </colgroup>
          <thead>
            <tr>
              <th>Prefix</th>
              <th>Limit</th>
              <th>Keys</th>
              <th>In flight</th>
              <th>Busiest key</th>
              <th class="cell-actions">Actions</th>
            </tr>
          </thead>
          <tbody>
            <template x-for="p in policies" :key="p.prefix">
              <tr>
                <td class="text-break">
                  <a href="#" @click.prevent="toggleKeys(p)" x-text="p.prefix"></a>
                  <span x-show="hasOverride(p)" class="badge bg-info-subtle text-info-emphasis ms-1">override</span>
                </td>
                <td x-text="effLimit(p)"></td>
                <td x-text="p.keyCount"></td>
                <td x-text="p.totalInFlight"></td>
                <td>
                  <template x-if="p.keyCount > 0">
                    <div class="d-flex align-items-center gap-2" :title="busiestTitle(p)">
                      <div class="progress flex-grow-1" style="height: 16px;">
                        <div class="progress-bar" :class="busiestClass(p)" :style="`width: ${busiestPct(p)}%`"></div>
                      </div>
                      <span class="small text-muted text-end" style="width: 3.5rem;" x-text="busiestLabel(p)"></span>
                    </div>
                  </template>
                  <span x-show="p.keyCount === 0" class="text-muted">-</span>
                </td>
                <td class="cell-actions">
                  <button class="btn btn-outline-primary btn-sm" @click="openEdit(p)">Edit</button>
                </td>
              </tr>
            </template>
            <tr x-show="!loading && _loadErrored && policies.length === 0"><td colspan="6" class="text-danger text-center">Failed to load concurrency pools. <a href="#" @click.prevent="loadPolicies()">Retry</a></td></tr>
            <tr x-show="!loading && !_loadErrored && loaded && policies.length === 0"><td colspan="6" class="text-muted text-center">No concurrency pools declared.</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Key drill-down -->
      <div x-show="expandedPrefix" class="mt-2">
        <h6 class="mb-2">
          Keys for <code x-text="expandedPrefix"></code>
          <span class="text-muted small fw-normal" x-show="hasMoreItems()"
            x-text="`showing ${itemCap} busiest of ${itemTotal()}`"></span>
        </h6>
        <div class="table-responsive">
          <table class="table table-sm table-bordered" style="table-layout: fixed; width: 100%;">
            <colgroup><col style="width: 50%"><col style="width: 20%"><col style="width: 30%"></colgroup>
            <thead><tr><th>Key</th><th>In flight</th><th>Fill</th></tr></thead>
            <tbody>
              <template x-for="k in keys" :key="k.key">
                <tr>
                  <td class="text-break"><code x-text="k.key"></code></td>
                  <td><span x-text="k.inFlight"></span> / <span x-text="k.effectiveLimit"></span></td>
                  <td>
                    <div class="d-flex align-items-center gap-2">
                      <div class="progress flex-grow-1" style="height: 14px;">
                        <div class="progress-bar" :class="keyFillClass(k)" :style="`width: ${keyFillPct(k)}%`"></div>
                      </div>
                      <span class="small text-muted text-end" style="width: 2.75rem;" x-text="keyFillPct(k) + '%'"></span>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="keysLoading"><td colspan="3" class="text-muted text-center">Loading…</td></tr>
              <tr x-show="!keysLoading && keys.length === 0"><td colspan="3" class="text-muted text-center">No active keys for this pool.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit override modal -->
      <div class="modal fade" id="concurrencyEditModal" tabindex="-1" aria-labelledby="concurrencyEditModalLabel">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="concurrencyEditModalLabel">Override <code x-text="edit.prefix"></code></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p class="text-muted small">A lower limit does not preempt in-flight jobs. It applies as they drain. Uncheck to revert to the declared default.</p>
              <div class="mb-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="ccLimitOn" x-model="edit.limitOn">
                  <label class="form-check-label" for="ccLimitOn">Concurrent limit per key</label>
                </div>
                <input type="number" min="0" step="1" class="form-control form-control-sm" x-model="edit.limit" :disabled="!edit.limitOn"
                  @keydown.enter.prevent="saveEdit()" :placeholder="`default ${edit.defaultLimit}`">
              </div>
              <div class="alert alert-danger py-2 mb-0" x-show="edit.error" x-text="edit.error"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary btn-sm" @click="saveEdit()" :disabled="edit.saving">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </template>
</div>

<!-- Toast container -->
<!-- Cron modals, shared by the per-queue Cron tab and the global Cron overview. -->
<div class="modal fade" id="cronToggleModal" tabindex="-1" aria-labelledby="cronToggleModalLabel">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cronToggleModalLabel">Disable schedule <code x-text="$store.cronEdit.confirmTarget"></code></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Disabling stops scheduled ticks for this schedule. Manual runs are refused until it is re-enabled.</p>
        <label class="form-label small">Type the schedule name <code x-text="$store.cronEdit.confirmTarget"></code> to confirm:</label>
        <input type="text" class="form-control form-control-sm" x-model="$store.cronEdit.confirmText" autocomplete="off" spellcheck="false"
               @keydown.enter.prevent="$store.cronEdit.confirmToggleEnabled()" :placeholder="$store.cronEdit.confirmTarget">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-warning btn-sm" @click="$store.cronEdit.confirmToggleEnabled()" :disabled="!$store.cronEdit.confirmValid() || $store.cronEdit.isHostBusy($store.cronEdit.confirmTarget)">Disable schedule</button>
      </div>
    </div>
  </div>
</div>

<!-- Cron override editor, shared. -->
<div class="modal fade" id="cronEditModal" tabindex="-1" aria-labelledby="cronEditModalLabel">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cronEditModalLabel">Override <code x-text="$store.cronEdit.edit.name"></code> <span class="text-muted small" x-text="$store.cronEdit.edit.queueName"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">Overrides take effect on the next tick. Uncheck a field to revert it to the declared default.</p>
        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cronExprOn" x-model="$store.cronEdit.edit.exprOn">
            <label class="form-check-label" for="cronExprOn">Expression</label>
          </div>
          <input type="text" class="form-control form-control-sm" x-model="$store.cronEdit.edit.expr" :disabled="!$store.cronEdit.edit.exprOn"
            @keydown.enter.prevent="$store.cronEdit.saveEdit()" :placeholder="`default ${$store.cronEdit.edit.defaultExpression}`">
          <small class="text-muted" x-text="$store.cronEdit.editDescribe()"></small>
        </div>
        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cronOverlapOn" x-model="$store.cronEdit.edit.overlapOn">
            <label class="form-check-label" for="cronOverlapOn">Overlap policy</label>
          </div>
          <select class="form-select form-select-sm" x-model="$store.cronEdit.edit.overlap" :disabled="!$store.cronEdit.edit.overlapOn">
            <option value="SkipOverlap">SkipOverlap</option>
            <option value="AllowOverlap">AllowOverlap</option>
          </select>
          <small class="text-muted" x-show="!$store.cronEdit.edit.overlapOn" x-text="`default ${$store.cronEdit.edit.defaultOverlap}`"></small>
        </div>
        <div class="mb-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="cronTzOn" x-model="$store.cronEdit.edit.tzOn">
            <label class="form-check-label" for="cronTzOn">Timezone</label>
          </div>
          <input type="text" class="form-control form-control-sm" list="cronTzOptions" x-model="$store.cronEdit.edit.tz"
            :disabled="!$store.cronEdit.edit.tzOn" autocomplete="off" spellcheck="false"
            @keydown.enter.prevent="$store.cronEdit.saveEdit()" placeholder="IANA zone, e.g. America/New_York">
          <datalist id="cronTzOptions">
            <template x-for="z in $store.cronEdit.tzList" :key="z"><option :value="z"></option></template>
          </datalist>
          <small class="text-muted" x-show="!$store.cronEdit.edit.tzOn" x-text="`default ${$store.cronEdit.edit.defaultTimezone}`"></small>
        </div>
        <div class="alert alert-danger py-2 mb-0" x-show="$store.cronEdit.edit.error" x-text="$store.cronEdit.edit.error"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" @click="$store.cronEdit.saveEdit()" :disabled="$store.cronEdit.edit.saving">Save</button>
      </div>
    </div>
  </div>
</div>
