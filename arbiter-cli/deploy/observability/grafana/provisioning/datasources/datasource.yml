apiVersion: 1
datasources:
  - name: Prometheus
    uid: arbiter-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Tempo
    uid: arbiter-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: arbiter-prometheus
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        queries:
          - name: 'Handler duration p95'
            query: 'histogram_quantile(0.95, sum by (le) (rate(arbiter_job_handler_duration_bucket[5m])))'
